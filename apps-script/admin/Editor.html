<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<base target="_top">
<style>
  :root { color-scheme:light; --paper:#fffdf7; --bg:#f6f2e9; --ink:#342f29; --gold:#725224; --line:#dacfbb; --error:#8c352c; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); background:var(--bg); font:16px/1.5 system-ui,"PingFang TC",sans-serif; }
  [hidden] { display:none!important; }
  button,input,textarea,select { font:inherit; color:inherit; }
  button { min-height:44px; padding:.35rem .7rem; border:1px solid var(--line); border-radius:.4rem; background:var(--paper); cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--gold); color:white; border-color:var(--gold); }
  button.quiet { border-color:transparent; background:transparent; }
  button[aria-pressed="true"] { border-color:var(--gold); color:var(--gold); }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  h1,h2,h3,p { margin:.35rem 0; }
  h1,h2 { font-family:"Noto Serif TC","Songti TC",serif; }
  h1 { font-size:1.35rem; } h2 { font-size:1.35rem; } h3 { font-size:1rem; }
  header { background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:1; }
  .top { max-width:1360px; margin:auto; padding:.55rem clamp(.6rem,3vw,1.4rem); }
  .row { display:flex; flex-wrap:wrap; gap:.35rem .5rem; align-items:center; }
  .spread { justify-content:space-between; }
  #state,#feedback,#frame-status { font-size:.875rem; }
  #feedback,#form-error { white-space:pre-line; overflow-wrap:anywhere; }
  .error,.danger { color:var(--error); }
  .muted { color:#655a49; }
  #manager { max-width:1360px; margin:auto; padding:0 clamp(.35rem,3vw,1.4rem); }
  .nav { padding:.3rem 0; }
  iframe { display:block; width:100%; height:calc(100dvh - 156px); min-height:380px; border:1px solid var(--line); border-radius:.5rem; background:var(--bg); }
  body:has(#tools:not([hidden])) { height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr); overflow:hidden; }
  body:has(#tools:not([hidden])) #manager { width:100%; margin:0 auto; display:flex; flex-direction:column; }
  body:has(#tools:not([hidden])) #frame { min-height:0; flex:1; padding-bottom:.45rem; }
  body:has(#tools:not([hidden])) iframe { height:100%; min-height:0; }
  dialog { width:min(calc(100% - 1rem),39rem); max-height:calc(100dvh - 1rem); margin:auto; padding:0; border:1px solid var(--line); border-radius:.65rem; color:var(--ink); background:var(--paper); }
  dialog::backdrop { background:#342f2955; }
  .dialog-head,.dialog-body,.dialog-foot { padding:.68rem 1rem; }
  .dialog-head { position:sticky; top:0; z-index:1; background:var(--paper); border-bottom:1px solid var(--line); }
  .dialog-foot { position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--line); justify-content:flex-end; }
  .dialog-body>*+* { margin-top:.65rem; }
  .field { display:block; min-width:0; }
  .field>span { display:block; font-weight:650; margin-bottom:.22rem; }
  input:not([type=checkbox]),textarea,select { width:100%; min-height:44px; padding:.4rem .6rem; border:1px solid var(--line); border-radius:.35rem; background:white; }
  textarea { resize:vertical; }
  .toggle { display:flex; align-items:center; gap:.5rem; min-height:44px; }
  input[type=checkbox] { width:1.2rem; height:1.2rem; accent-color:var(--gold); margin:0; flex-shrink:0; }
  details > summary { min-height:44px; padding:.55rem 0; cursor:pointer; font-weight:650; overflow-wrap:anywhere; }
  .fields { display:grid; gap:.6rem; min-width:0; }
  .entries,.history,.options,.changes { list-style:none; margin:0; padding:0; }
  .entries>details,.entries>.value-row,.history>li,.changes>li,.options>li { border-top:1px solid var(--line); }
  .value-row,.changes>li,.history>li { padding:.55rem 0; overflow-wrap:anywhere; }
  .entries>details>.fields { padding:.15rem 0 .55rem; }
  .option { width:100%; text-align:left; }
  .member-options { margin:0; max-height:12rem; overflow:auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(7rem,1fr)); padding:0 .2rem; }
  .entry-tools { margin:.25rem 0 .6rem; }
  .changes dl { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:.2rem .8rem; margin:.3rem 0; }
  .changes dt { color:#655a49; } .changes dd { margin:0; white-space:pre-wrap; }
  #setup, #retry { margin:.7rem auto; max-width:36rem; padding:1rem; }
  @media(max-width:560px) {
    .top { padding:.4rem .55rem; }
    h1 { font-size:1.15rem; }
    iframe { height:calc(100dvh - 196px); }
    .nav { gap:.15rem; } .nav button { padding-inline:.3rem; font-size:.8125rem; }
    .dialog-head,.dialog-body,.dialog-foot { padding:.55rem .7rem; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="row spread"><h1>婚禮工作指南｜編輯</h1><span id="state" role="status">正在讀取草稿…</span></div>
    <div class="row" id="tools" hidden>
      <button id="save" type="button">儲存草稿</button>
      <button id="preview" type="button" aria-pressed="false">預覽</button>
      <button id="publish" type="button" class="primary">發布</button>
      <button id="advanced" type="button" class="quiet">進階設定</button>
    </div>
    <p id="feedback" role="status" hidden></p>
  </div>
</header>
<button id="retry" type="button" hidden>重新讀取伺服器資料</button>
<section id="setup" hidden>
  <h2>建立第一份草稿</h2>
  <input id="seed" aria-label="婚禮資料 JSON" type="file" accept=".json,application/json">
  <div class="row"><button id="review-seed" type="button">驗證並預覽</button><button id="initialize" type="button" class="primary" disabled>建立草稿</button></div>
  <p id="seed-info" class="muted"></p>
</section>
<main id="manager" hidden>
  <nav class="row nav" aria-label="編輯導覽" id="navigation">
    <button type="button" data-section="schedule" aria-pressed="true" class="quiet">當日總流程</button>
    <button type="button" data-section="teams" class="quiet">工作分配及各組指南</button>
    <button type="button" data-section="reception" class="quiet">婚宴安排</button>
    <button type="button" id="library">新增／隱藏</button>
  </nav>
  <p id="frame-status" class="muted" role="status" hidden></p>
  <div id="frame"></div>
</main>
<dialog id="panel" aria-labelledby="panel-title">
  <div class="dialog-head row spread"><h2 id="panel-title"></h2><button type="button" id="close" class="quiet">關閉</button></div>
  <div class="dialog-body" id="panel-body"></div>
  <div class="dialog-foot row" id="panel-actions"></div>
</dialog>
<dialog id="confirmation" aria-labelledby="confirm-message">
  <div class="dialog-body" id="confirm-message"></div>
  <form class="dialog-foot row" method="dialog"><button value="cancel" autofocus>取消</button><button value="confirm" class="primary">確認</button></form>
</dialog>
<script>
'use strict';
const get = (id) => document.getElementById(id);
const states = { confirmed:'已確認', tentative:'暫定', pending:'待公布' };
const friendly = {
  overviewTitle:'總流程顯示名稱（可留空）', overviewHidden:'從當日總流程隱藏',
  indexHidden:'從工作分配索引隱藏', guideTeamIds:'也顯示於以下工作指南',
  memberIds:'組員', supportIds:'機動支援', candidateIds:'待核對姓名',
  scheduleId:'沿用總流程時間', startEventId:'開始時間連結', endEventId:'目標結束時間連結',
  summary:'工作說明', note:'補充說明', advanceTeam:'先遣人員', status:'安排狀態'
};
const areas = {
  schedule:['當日總流程','schedule'], teams:['工作組別','teams'], reception:['婚宴安排','reception'],
  management:['現場統籌及各區負責人','management'], assignments:['兼任工作交接','assignments'],
  ceremony:['婚禮節目及時間','ceremony'], cameraPositions:['直播機位','cameraPositions'],
  avCues:['影音操作提示','avCues'], avChecklist:['影音測試及設備說明','avChecklist','equipment','avInfo'],
  photoGroups:['大合照安排','photoGroups'], photoServices:['攝影及背板服務','photoServices'],
  cleanup:['撤場期限、工作及物資去向','cleanup'], venues:['場地、地址及動線','venues'],
  seating:['座位及大合照配置說明','seating'], people:['工作人員名單','people'],
  sections:['網站區塊顯示設定','sections'], weddingInfo:['新人及場地資訊','weddingInfo'],
  keyTimes:['重要時間','keyTimes'], privateNotes:['內部備註','privateNotes']
};
let model, draft, visibleDraft, session, transaction, seedReview;
let dirty = false, busy = false, checking = false, previewOnly = false, selectedSection = 'schedule';

const copy = (value) => JSON.parse(JSON.stringify(value));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function node(tag, text) {
  const item = document.createElement(tag);
  if (text !== undefined) item.textContent = text;
  return item;
}
function button(text, click, className = '') {
  const item = node('button', text);
  item.type = 'button';
  item.className = className;
  item.onclick = click;
  return item;
}
function message(text = '', error = false) {
  const item = get('feedback');
  item.textContent = text;
  item.hidden = !text;
  item.classList.toggle('error', error);
}
function formatTime(value) {
  return new Date(value).toLocaleString('zh-TW', { timeZone:'Asia/Taipei', hour12:false });
}
function updateState() {
  if (!model) return;
  const published = model.published;
  get('state').textContent = dirty ? '尚未儲存的修改' : published?.version === model.revision
    ? '已發布最新版本・' + formatTime(published.updatedAt)
    : draft ? '草稿已儲存，尚未發布' : '尚未建立草稿';
  get('save').disabled = busy || checking || !dirty;
  get('publish').disabled = busy || checking || !dirty && published?.version === model.revision;
  get('advanced').disabled = busy || checking;
}
function confirmAction(text) {
  const dialog = get('confirmation');
  dialog.returnValue = '';
  get('confirm-message').textContent = text;
  dialog.showModal();
  return new Promise((resolve) => {
    dialog.addEventListener('close', () => resolve(dialog.returnValue === 'confirm'), { once:true });
  });
}
function rpc(action, payload = {}) {
  return new Promise((resolve, reject) =>
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).adminRequest(action, payload)
  );
}
async function perform(work, label) {
  if (busy || checking) return;
  busy = true;
  updateState();
  message();
  try { await work(); }
  catch (error) {
    const text = label + '。' + (error.message || String(error));
    if (get('panel').open) {
      get('panel-error')?.remove();
      const item = node('p',text);
      item.id = 'panel-error';
      item.className = 'error';
      item.setAttribute('role','alert');
      get('panel-body').prepend(item);
    } else message(text,true);
  }
  finally { busy = false; updateState(); }
}
window.addEventListener('beforeunload', (event) => {
  if (dirty || transaction?.modified()) { event.preventDefault(); event.returnValue = ''; }
});

function frameNotice(text = '') {
  get('frame-status').hidden = !text;
  get('frame-status').textContent = text;
}
function sendPreview(type, more) {
  if (session?.ready) session.frame.contentWindow.postMessage({ type, nonce:session.nonce, ...more }, session.origin);
}
function renderPreview() {
  if (!visibleDraft) return;
  if (!session) {
    const url = new URL(model.siteUrl);
    url.searchParams.set('staff-editor', '2');
    const nonce = crypto.randomUUID();
    url.hash = 'staff-preview=' + nonce;
    const frame = node('iframe');
    frame.title = '婚禮工作指南即時預覽';
    frame.referrerPolicy = 'no-referrer';
    frame.src = url.href;
    session = { frame, nonce, origin:url.origin, ready:false, received:false };
    get('frame').replaceChildren(frame);
    frameNotice('正在開啟網站預覽…');
    session.timer = setTimeout(() => {
      if (!session?.received) frameNotice('預覽尚未回應。可從進階設定重新載入預覽。');
    }, 12000);
  }
  session.received = false;
  sendPreview('staff-preview-data', { data:visibleDraft, editing:Boolean(draft) && !previewOnly });
}
window.addEventListener('message', (event) => {
  if (!session || event.source !== session.frame.contentWindow || event.origin !== session.origin) return;
  const message = event.data;
  if (message?.nonce !== session.nonce) return;
  if (message.type === 'staff-preview-ready') {
    session.ready = true;
    renderPreview();
  } else if (message.type === 'staff-preview-rendered') {
    session.received = true;
    clearTimeout(session.timer);
    frameNotice();
  } else if (message.type === 'staff-preview-edit' && session.received && draft && !previewOnly &&
      !busy && !checking && !get('panel').open) {
    selectContent(message.target);
  }
});
function setPreviewMode(only) {
  previewOnly = only;
  get('preview').setAttribute('aria-pressed', String(only));
  get('preview').textContent = only ? '返回編輯' : '預覽';
  get('navigation').hidden = only;
  renderPreview();
}
get('preview').onclick = () => { if (!busy && !checking) setPreviewMode(!previewOnly); };

async function applyState(result) {
  model = { ...model, ...result };
  draft = result.draft;
  dirty = false;
  get('setup').hidden = Boolean(draft);
  get('tools').hidden = !draft;
  get('retry').hidden = true;
  get('navigation').hidden = !draft || previewOnly;
  updateState();
  if (!draft) return;
  get('manager').hidden = false;
  try {
    visibleDraft = await rpc('preview', { data:draft });
    renderPreview();
  } catch (error) {
    frameNotice('無法更新預覽。' + (error.message || error));
  }
}
async function reload() {
  if (dirty && !await confirmAction('重新讀取會捨棄未儲存的修改。確定繼續？')) return;
  dismissPanel();
  await perform(async () => applyState(await rpc('load')), '讀取失敗');
  if (!model) get('retry').hidden = false;
}
get('retry').onclick = reload;
get('navigation').addEventListener('click', (event) => {
  const section = event.target.dataset.section;
  if (!section) return;
  selectedSection = section;
  get('navigation').querySelectorAll('[data-section]').forEach((item) =>
    item.setAttribute('aria-pressed', String(item.dataset.section === section)));
  sendPreview('staff-preview-navigate', { section });
});
get('library').onclick = showLibrary;

function panel(title) {
  get('panel-title').textContent = title;
  get('panel-body').replaceChildren();
  get('panel-actions').replaceChildren();
  get('panel-actions').hidden = true;
  if (!get('panel').open) get('panel').showModal();
  get('panel').scrollTop = 0;
  return get('panel-body');
}
async function closePanel() {
  if (checking || transaction?.modified() && !await confirmAction('捨棄這個視窗中尚未套用的修改？')) return;
  dismissPanel();
}
function dismissPanel() {
  transaction = null;
  get('panel').close();
}
get('close').onclick = closePanel;
get('panel').addEventListener('cancel', (event) => { event.preventDefault(); closePanel(); });

function namesIn(value, data) {
  const names = new Map(data.people.map(({ id, name }) => [id, name]));
  return String(value ?? '').replace(/\{person:([^{}]+)\}/g, (_, id) => names.get(id) || '（人員待確認）');
}
function optionsFor(type, data) {
  if (type === 'person') return data.people.map(({ id, name }) => [id, name]);
  if (type === 'team') return [...data.teams, ...(data.reception.groups || [])].map(({ id, name }) => [id, namesIn(name, data)]);
  if (type === 'event') return data.schedule.flatMap(({ events }) => events.map(({ id, time, title }) => [id, time + ' ' + namesIn(title, data)]));
  return Object.entries(states);
}
function fresh(spec) {
  if (spec.type === 'workItem') return { text:'' };
  if (spec.type === 'object') return Object.fromEntries(Object.entries(spec.fields)
    .filter(([, field]) => !field.optional).map(([key, field]) => [key, fresh(field)]));
  if (spec.type === 'list') return [];
  if (spec.type === 'bool') return false;
  if (spec.type === 'status') return 'confirmed';
  if (spec.type === 'id') return 'item-' + crypto.randomUUID();
  return '';
}
function titleFor(item, spec, index, data) {
  if (typeof item === 'string') return namesIn(item, data);
  const person = optionsFor('person', data).find(([id]) => id === item.personId)?.[1];
  return namesIn(item.name || item.title || item.label || item.date || item.role || item.moment ||
    item.text || person || spec.label + ' ' + (index + 1), data);
}
function appendFields(parent, specs, owner, path, data, preferred) {
  Object.entries(specs).forEach(([key, spec]) => renderField(parent, spec, owner, key, [...path,key], data, preferred));
}
function fieldLabel(spec, key) {
  return key === 'hidden' ? '顯示於網站' : friendly[key] || spec.label;
}
function renderField(parent, spec, owner, key, path, data, preferred) {
  if (spec.type === 'id' || spec.private && !transaction.private) return;
  if (spec.type === 'list' && spec.item.type === 'person') {
    renderMembers(parent, spec, owner, key, path, data, preferred);
    return;
  }
  if (spec.type === 'list' || spec.type === 'object') {
    const group = node('div');
    group.className = 'fields';
    const nested = spec.type === 'list' && (path.length > 1 || key === 'periods');
    const box = nested ? node('details') : group;
    if (nested) {
      box.append(node('summary', fieldLabel(spec, key)), group);
      box.open = preferred && path.every((part, index) => part === preferred[index]);
    } else group.append(node('h3', fieldLabel(spec, key)));
    parent.append(box);
    if (spec.type === 'list') renderList(group, spec, owner, key, path, data, preferred);
    else {
      const value = owner[key] || {};
      group.addEventListener('input', () => { owner[key] = value; });
      group.addEventListener('change', () => { owner[key] = value; });
      appendFields(group, spec.fields, value, path, data, preferred);
    }
    return;
  }
  const label = node('label');
  const caption = node('span', fieldLabel(spec, key));
  let control;
  if (spec.type === 'bool') {
    label.className = 'toggle';
    control = node('input');
    control.type = 'checkbox';
    control.checked = key === 'hidden' ? !owner[key] : Boolean(owner[key]);
    label.append(control, caption);
  } else {
    label.className = 'field';
    label.append(caption);
    if (['person','team','event','status'].includes(spec.type)) {
      control = node('select');
      if (spec.optional || !owner[key]) control.append(new Option(spec.optional ? '未指定' : '請選擇', ''));
      optionsFor(spec.type, data).forEach(([value, text]) => control.append(new Option(text, value)));
      control.value = owner[key] || '';
    } else {
      const original = spec.private ? String(owner[key] || '') : namesIn(owner[key], data);
      const multiline = spec.private || original.length > 42 || ['text','summary','detail','work','note'].includes(key);
      control = node(multiline ? 'textarea' : 'input');
      control.maxLength = spec.maxLength || (spec.private ? 12000 : 2500);
      control.value = original;
      if (multiline) control.rows = original.length > 110 ? 4 : 2;
    }
    label.append(control);
  }
  control.addEventListener('input', () => {
    if (spec.type === 'bool') owner[key] = key === 'hidden' ? !control.checked : control.checked;
    else if (!control.value && spec.optional && ['person','team','event','status'].includes(spec.type)) delete owner[key];
    else owner[key] = control.value;
  });
  parent.append(label);
  if (same(path, preferred)) transaction.focus = control;
}

function renderMembers(parent, spec, owner, key, path, data, preferred) {
  const box = node('details');
  const summary = node('summary');
  const items = node('div');
  items.className = 'member-options';
  box.open = same(path, preferred);
  box.append(summary, items);
  const name = node('input');
  name.placeholder = '輸入姓名';
  name.setAttribute('aria-label', '新工作人員姓名');
  const add = async () => {
    const value = name.value.trim();
    if (!value) { name.focus(); return; }
    if (data.people.some((person) => person.name.trim() === value) &&
        !await confirmAction('已有同名人員「' + value + '」。確認是不同的人，再新增一筆？')) return;
    const person = { ...fresh(model.schema.fields.people.item), name:value };
    data.people.push(person);
    owner[key] = [...(owner[key] || []), person.id];
    name.value = '';
    draw();
  };
  function draw() {
    const selected = owner[key] || [];
    summary.textContent = fieldLabel(spec, key) + (selected.length ? '｜' + selected.map((id) =>
      data.people.find((person) => person.id === id)?.name).filter(Boolean).join('、') : '');
    items.replaceChildren(...data.people.map(({ id, name }) => {
      const label = node('label');
      label.className = 'toggle';
      const check = node('input');
      check.type = 'checkbox';
      check.checked = selected.includes(id);
      check.addEventListener('change', () => {
        const current = owner[key] || [];
        owner[key] = check.checked ? [...current, id] : current.filter((value) => value !== id);
        summary.textContent = fieldLabel(spec, key) + '｜' + data.people.filter((person) => owner[key].includes(person.id)).map((person) => person.name).join('、');
      });
      label.append(check, node('span', name));
      return label;
    }));
  }
  if (key === 'memberIds') {
    const tools = node('div');
    tools.className = 'row';
    tools.append(name, button('新增這位人員並加入', add));
    box.append(tools);
  }
  parent.append(box);
  draw();
}

async function confirmDelete(title) {
  return await confirmAction('要刪除「' + title + '」嗎？') &&
    await confirmAction('請再次確認刪除「' + title + '」。');
}
function entryTools(container, array, index, title, redraw) {
  const controls = node('div');
  controls.className = 'row entry-tools';
  for (const [offset, label] of [[-1,'上移'],[1,'下移']]) {
    const move = button(label, () => {
      const destination = index + offset;
      [array[index], array[destination]] = [array[destination], array[index]];
      redraw(destination);
    });
    move.disabled = index + offset < 0 || index + offset >= array.length;
    controls.append(move);
  }
  controls.append(button('刪除', async () => {
    if (!await confirmDelete(title)) return;
    array.splice(index,1);
    redraw();
  }, 'danger quiet'));
  container.append(controls);
}

function renderList(parent, spec, owner, key, path, data, preferred) {
  const entries = node('div');
  entries.className = 'entries';
  const array = () => owner[key] || [];
  function draw(openIndex, focusPath) {
    entries.replaceChildren(...array().map((value, index) => {
      const itemPath = [...path,index];
      const row = node('details');

function describeChange(value, spec, data) {
  if (value === undefined || value === null || value === '') return '—';
  if (spec.type === 'bool') return value ? '是' : '否';
  if (['person','team','event','status'].includes(spec.type)) {
    return optionsFor(spec.type,data).find(([id]) => id === value)?.[1] || '未指定';
  }
  if (spec.type === 'workItem') return namesIn(typeof value === 'string' ? value : value.text,data);
  if (spec.type === 'list') {
    return value.map((item) => describeChange(item,spec.item,data)).join('、') || '—';
  }
  if (spec.type === 'object') {
    return Object.entries(spec.fields).filter(([key,child]) =>
      child.type !== 'id' && child.type !== 'bool' && !child.private && value[key] !== undefined
    ).map(([key,child]) => fieldLabel(child,key) + '　' + describeChange(value[key],child,data)).join('\n') || '—';
  }
  return namesIn(value,data);
}

function pairRecords(before, after) {
  const used = new Set();
  const pairs = after.map((item,newIndex) => ({ item,newIndex,oldIndex:-1 }));
  const identity = (item) => item && typeof item === 'object' &&
    (item.id || item.title || item.name || item.label || item.role || item.moment || item.personId);
  for (const matches of [
    (a,b) => Boolean(a?.id) && a.id === b?.id,
    (a,b) => same(a,b),
    (a,b) => Boolean(identity(a)) && identity(a) === identity(b),
    (a,b) => !a?.id && !b?.id
  ]) {
    for (const pair of pairs) {
      if (pair.oldIndex !== -1) continue;
      const index = before.findIndex((item,i) => !used.has(i) && matches(item,pair.item));
      if (index !== -1) { pair.oldIndex = index; used.add(index); }
    }
  }
  return { pairs, removed:before.map((item,index) => ({ item,index })).filter(({ index }) => !used.has(index)) };
}

function reviewChanges(before, after, schema) {
  if (!before) return [{ title:'首次發布', before:'尚未有公開版本',
    after:after.people.length + ' 位人員、' + after.teams.length + ' 個組別及目前的婚禮工作指南' }];
  const entries = [];
  let privateChanged = false;
  const add = (title, before, after) => entries.push({ title, before, after });
  function walk(a,b,spec,path,key) {
    if (spec.private) { privateChanged ||= !same(a,b); return; }
    if (spec.type === 'id') return;
    const label = fieldLabel(spec,key);
    const title = [...path,label].join('／');
    if (spec.type === 'bool') {
      if (Boolean(a) !== Boolean(b)) {
        const visibility = key === 'hidden' || key === 'overviewHidden' || key === 'indexHidden' || path[0] === '網站區塊顯示設定';
        add(title,visibility ? (a ? '隱藏' : '顯示') : describeChange(!!a,spec,before),
          visibility ? (b ? '隱藏' : '顯示') : describeChange(!!b,spec,after));
      }
      return;
    }
    if (spec.type === 'workItem') {
      walk(typeof a === 'string' ? { text:a } : a,typeof b === 'string' ? { text:b } : b,
        { ...spec,type:'object' },path,key);
      return;
    }
    if (spec.type === 'object') {
      Object.entries(spec.fields).forEach(([field,definition]) => walk(a?.[field],b?.[field],definition,[...path,label],field));
      return;
    }
    if (spec.type === 'list' && ['object','workItem'].includes(spec.item.type)) {
      const oldItems = a || [];
      const { pairs,removed } = pairRecords(oldItems,b || []);
      for (const { item,index } of removed) {
        add([...path,titleFor(item,spec.item,index,before),'已刪除'].join('／'),describeChange(item,spec.item,before),'—');
      }
      for (const {item,oldIndex,newIndex} of pairs) {
        const name = titleFor(item,spec.item,newIndex,after);
        if (oldIndex < 0) add([...path,name,'新增'].join('／'),'—',describeChange(item,spec.item,after));
        else walk(oldItems[oldIndex],item,{ ...spec.item,label:name },path,'');
      }
      const matched = pairs.filter(({oldIndex}) => oldIndex >= 0);
      const oldOrder = [...matched].sort((a,b) => a.oldIndex - b.oldIndex);
      if (matched.some((item,index) => item.oldIndex !== oldOrder[index].oldIndex)) {
        add(title + '／順序',
          oldOrder.map(({oldIndex}) => titleFor(oldItems[oldIndex],spec.item,oldIndex,before)).join(' → '),
          matched.map(({item,newIndex}) => titleFor(item,spec.item,newIndex,after)).join(' → '));
      }
      return;
    }
    if (spec.type === 'list' && spec.item.type === 'text' && !same(a || [],b || [])) {
      const oldText = (a || []).map((item) => namesIn(item,before));
      const newText = (b || []).map((item) => namesIn(item,after));
      if (!same(oldText,newText)) add(title,oldText.join('\n') || '—',newText.join('\n') || '—');
      return;
    }
    if (same(a,b)) return;
    const oldText = describeChange(a,spec,before);
    const newText = describeChange(b,spec,after);
    if (oldText !== newText) add(title,oldText,newText);
  }
  Object.entries(schema.fields).forEach(([key,spec]) => walk(before[key],after[key],spec,[],key));
  if (privateChanged) add('內部備註','上一版備註','已更新，僅管理者可見');
  return entries;
}

}
get('publish').onclick = () => {
  if (dirty) { message('請先儲存草稿，再比較差異及發布。', true); return; }
  return perform(async () => showReview(await rpc('review',{ revision:model.revision })),'無法取得發布差異');
};
reload();
</script>
</body>
</html>
