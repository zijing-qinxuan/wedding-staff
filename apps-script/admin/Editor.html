<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<base target="_top">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@500;600&amp;display=swap">
<style>
  :root { color-scheme:light; --paper:#fffcf7; --bg:#f8f5ee; --ink:#39352f; --gold:#765a36; --line:#ded5c5; --error:#8c352c; --muted:#665e52; --serif:"Noto Serif TC","Songti TC","PMingLiU",serif; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); background:var(--bg); font:16px/1.65 "Noto Sans TC","Taipei Sans TC Beta","PingFang TC","Microsoft JhengHei",sans-serif; }
  [hidden] { display:none!important; }
  button,input,textarea,select { font:inherit; color:inherit; }
  button { min-height:44px; padding:.35rem .7rem; border:1px solid var(--line); border-radius:.4rem; background:var(--paper); cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--gold); color:white; border-color:var(--gold); }
  button.quiet { border-color:transparent; background:transparent; }
  button[aria-pressed="true"] { border-color:var(--gold); color:var(--gold); }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  h1,h2,h3,p { margin:.35rem 0; }
  h1 { font:600 1.5rem/1.35 var(--serif); }
  h2 { font-size:1.375rem; font-weight:600; line-height:1.4; }
  h3 { font-size:1.125rem; font-weight:600; }
  header { background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:1; }
  .top { max-width:1100px; margin:auto; padding:.6rem clamp(.65rem,3vw,1.4rem); }
  .row { display:flex; flex-wrap:wrap; gap:.35rem .5rem; align-items:center; }
  .spread { justify-content:space-between; }
  #state,#feedback,#frame-status { font-size:.875rem; }
  #feedback,#form-error { white-space:pre-line; overflow-wrap:anywhere; }
  .error,.danger { color:var(--error); }
  .muted { color:var(--muted); font-size:.875rem; }
  #manager { max-width:1100px; margin:auto; padding:0 clamp(.35rem,3vw,1.4rem); }
  .nav { padding:.3rem 0; }
  iframe { display:block; width:100%; height:calc(100dvh - 156px); min-height:380px; border:1px solid var(--line); border-radius:.5rem; background:var(--bg); }
  body:has(#tools:not([hidden])) { height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr); overflow:hidden; }
  body:has(#tools:not([hidden])) #manager { width:100%; margin:0 auto; display:flex; flex-direction:column; }
  body:has(#tools:not([hidden])) #frame { min-height:0; flex:1; padding-bottom:.45rem; }
  body:has(#tools:not([hidden])) iframe { height:100%; min-height:0; }
  dialog { width:min(calc(100% - 2rem),46rem); max-height:calc(100dvh - 2rem); margin:auto; padding:0; border:1px solid var(--line); border-radius:.6rem; color:var(--ink); background:var(--paper); }
  #panel[open] { display:grid; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden; }
  #panel-body { min-height:0; overflow:auto; overscroll-behavior:contain; }
  #confirmation { width:min(calc(100% - 2rem),29rem); }
  dialog::backdrop { background:#342f2955; }
  .dialog-head,.dialog-body,.dialog-foot { padding:.75rem clamp(.75rem,3vw,1.5rem); }
  .dialog-head { border-bottom:1px solid var(--line); }
  .dialog-foot { border-top:1px solid var(--line); justify-content:flex-end; }
  .dialog-body>*+* { margin-top:.65rem; }
  .field { display:block; min-width:0; }
  .field>span { display:block; font-weight:650; margin-bottom:.22rem; }
  input:not([type=checkbox]),textarea,select { width:100%; min-height:44px; padding:.4rem .65rem; border:1px solid var(--line); border-radius:.35rem; background:white; }
  textarea { resize:vertical; }
  .toggle { display:flex; align-items:center; gap:.5rem; min-height:44px; }
  input[type=checkbox] { width:1.2rem; height:1.2rem; accent-color:var(--gold); margin:0; flex-shrink:0; }
  details > summary { min-height:44px; padding:.55rem 0; cursor:pointer; font-weight:650; overflow-wrap:anywhere; }
  .fields { display:grid; gap:.6rem; min-width:0; }
  .entries,.history,.options,.changes { list-style:none; margin:0; padding:0; }
  .entries>details,.entries>.value-row,.history>li,.changes>li,.options>li { border-top:1px solid var(--line); }
  .value-row,.changes>li,.history>li { padding:.55rem 0; overflow-wrap:anywhere; }
  .entries>details>.fields { padding:.15rem 0 .55rem; }
  .option { width:100%; text-align:left; }
  .editor-section { padding-block:.7rem; border-top:1px solid var(--line); }
  .editor-section h3 { margin-top:0; }
  .member-tags { margin:.35rem 0 .7rem; }
  .member-tag { border-radius:2rem; background:var(--bg); }
  .suggestions { display:flex; flex-wrap:wrap; gap:.25rem .5rem; }
  .suggestions .option { width:auto; }
  .person-picker p:empty { display:none; }
  .candidate,.edit-period,.relations>li { border-top:1px solid var(--line); padding-bottom:.4rem; }
  .relations,.people-list { list-style:none; padding:0; margin:.5rem 0; }
  .people-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(7rem,1fr)); gap:.2rem .65rem; }
  .people-list li { border-bottom:1px solid var(--line); }
  .people-list button:hover,.suggestions button:hover,.member-tag:hover { background:var(--bg); border-color:var(--gold); }
  .period-preview { padding-inline-start:.75rem; }
  .task-lines { padding-inline-start:1.25rem; }
  .task-lines summary { font-weight:500; }
  .entry-tools { margin:.25rem 0 .6rem; }
  .changes dl { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:.2rem .8rem; margin:.3rem 0; }
  .changes dt { color:#655a49; } .changes dd { margin:0; white-space:pre-wrap; }
  #setup, #retry { margin:.7rem auto; max-width:36rem; padding:1rem; }
  @media(max-width:560px) {
    .top { padding:.4rem .55rem; }
    h1 { font-size:1.15rem; }
    iframe { height:calc(100dvh - 196px); }
    .nav { gap:.15rem; } .nav button { padding-inline:.3rem; font-size:.8125rem; }
    .dialog-head,.dialog-body,.dialog-foot { padding:.55rem .7rem; }
    #panel { width:calc(100% - .65rem); height:calc(100dvh - .65rem); max-height:calc(100dvh - .65rem); }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="row spread"><h1>婚禮工作指南｜編輯</h1><span id="state" role="status">正在讀取草稿…</span></div>
    <div class="row" id="tools" hidden>
      <button id="save" type="button">儲存草稿</button>
      <button id="preview" type="button" aria-pressed="false">預覽</button>
      <button id="publish" type="button" class="primary">發布</button>
      <button id="advanced" type="button" class="quiet">進階設定</button>
      <button id="verify-again" type="button" hidden>重新驗證公開版本</button>
    </div>
    <p id="feedback" role="status" hidden></p>
  </div>
</header>
<button id="retry" type="button" hidden>重新讀取伺服器資料</button>
<section id="setup" hidden>
  <h2>建立第一份草稿</h2>
  <input id="seed" aria-label="婚禮資料 JSON" type="file" accept=".json,application/json">
  <div class="row"><button id="review-seed" type="button">驗證並預覽</button><button id="initialize" type="button" class="primary" disabled>建立草稿</button></div>
  <p id="seed-info" class="muted"></p>
</section>
<main id="manager" hidden>
  <nav class="row nav" aria-label="編輯導覽" id="navigation">
    <button type="button" data-section="schedule" aria-pressed="true" class="quiet">當日總流程</button>
    <button type="button" data-section="teams" class="quiet">工作分配及各組指南</button>
    <button type="button" data-section="reception" class="quiet">婚宴安排</button>
    <button type="button" id="people" class="quiet">人員管理</button>
    <button type="button" id="library">新增／隱藏</button>
  </nav>
  <p id="frame-status" class="muted" role="status" hidden></p>
  <div id="frame"></div>
</main>
<dialog id="panel" aria-labelledby="panel-title">
  <div class="dialog-head row spread"><h2 id="panel-title"></h2><button type="button" id="close" class="quiet">關閉</button></div>
  <div class="dialog-body" id="panel-body"></div>
  <div class="dialog-foot row" id="panel-actions"></div>
</dialog>
<dialog id="confirmation" aria-labelledby="confirm-message">
  <div class="dialog-body" id="confirm-message"></div>
  <form class="dialog-foot row" method="dialog"><button value="cancel" autofocus>取消</button><button value="confirm" class="primary">確認</button></form>
</dialog>
<script>
'use strict';
const get = (id) => document.getElementById(id);
const states = { confirmed:'已確認', tentative:'暫定', pending:'待公布' };
const friendly = {
  overviewTitle:'總流程顯示名稱（可留空）', overviewHidden:'從當日總流程隱藏',
  indexHidden:'從工作分配索引隱藏', guideTeamIds:'也顯示於以下工作指南',
  memberIds:'組員', supportIds:'機動支援', candidateIds:'待核對姓名',
  scheduleId:'沿用總流程時間', startEventId:'開始時間連結', endEventId:'目標結束時間連結',
  summary:'工作說明', note:'補充說明', advanceTeam:'先遣人員', status:'安排狀態'
};
const areas = {
  schedule:['當日總流程','schedule'], teams:['工作組別','teams'], reception:['婚宴安排','reception'],
  management:['現場統籌及各區負責人','management'], assignments:['兼任工作交接','assignments'],
  ceremony:['婚禮節目及時間','ceremony'], cameraPositions:['直播機位','cameraPositions'],
  avCues:['影音操作提示','avCues'], avChecklist:['影音測試及設備說明','avChecklist','equipment','avInfo'],
  photoGroups:['大合照安排','photoGroups'], photoServices:['攝影及背板服務','photoServices'],
  cleanup:['撤場期限、工作及物資去向','cleanup'], venues:['場地、地址及動線','venues'],
  seating:['座位及大合照配置說明','seating'], people:['工作人員名單','people'],
  sections:['網站區塊顯示設定','sections'], weddingInfo:['新人及場地資訊','weddingInfo'],
  keyTimes:['重要時間','keyTimes'], privateNotes:['內部備註','privateNotes']
};
let model, draft, visibleDraft, session, transaction, seedReview, pendingVerification, lastPublication;
let dirty = false, busy = false, checking = false, previewOnly = false, selectedSection = 'schedule';

const copy = (value) => JSON.parse(JSON.stringify(value));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function node(tag, text) {
  const item = document.createElement(tag);
  if (text !== undefined) item.textContent = text;
  return item;
}
function button(text, click, className = '') {
  const item = node('button', text);
  item.type = 'button';
  item.className = className;
  item.onclick = click;
  return item;
}
function message(text = '', error = false) {
  const item = get('feedback');
  item.textContent = text;
  item.hidden = !text;
  item.classList.toggle('error', error);
}
function formatTime(value) {
  return new Date(value).toLocaleString('zh-TW', { timeZone:'Asia/Taipei', hour12:false });
}
function updateState() {
  if (!model) return;
  const published = model.published;
  const response = lastPublication?.version === published?.version ? lastPublication?.verified : undefined;
  const publicationState = response === null ? '正在驗證公開版本' : response === false
    ? '公開版本尚未確認' : published && '已發布最新版本・' + formatTime(published.updatedAt);
  get('state').textContent = dirty ? '尚未儲存的修改' : published?.version === model.revision
    ? publicationState
    : draft ? '草稿已儲存，尚未發布' : '尚未建立草稿';
  get('save').disabled = busy || checking || !dirty;
  get('publish').disabled = busy || checking || !dirty && published?.version === model.revision;
  get('advanced').disabled = busy || checking;
  get('verify-again').hidden = response !== false;
  get('verify-again').disabled = busy || checking;
}
function confirmAction(text) {
  const dialog = get('confirmation');
  const form = dialog.querySelector('form');
  get('confirm-message').textContent = text;
  return new Promise((resolve) => {
    const finish = (confirmed) => {
      form.removeEventListener('submit',submit);
      dialog.removeEventListener('cancel',cancel);
      dialog.close();
      resolve(confirmed);
    };
    const submit = (event) => {
      event.preventDefault();
      finish(event.submitter?.value === 'confirm');
    };
    const cancel = (event) => {
      event.preventDefault();
      finish(false);
    };
    form.addEventListener('submit',submit);
    dialog.addEventListener('cancel',cancel);
    dialog.showModal();
  });
}
function rpc(action, payload = {}) {
  return new Promise((resolve, reject) =>
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).adminRequest(action, payload)
  );
}
async function perform(work, label) {
  if (busy || checking) return;
  busy = true;
  updateState();
  message();
  try { await work(); }
  catch (error) {
    const text = label + '。' + (error.message || String(error));
    if (get('panel').open) {
      get('panel-error')?.remove();
      const item = node('p',text);
      item.id = 'panel-error';
      item.className = 'error';
      item.setAttribute('role','alert');
      get('panel-body').prepend(item);
    } else message(text,true);
  }
  finally { busy = false; updateState(); }
}
window.addEventListener('beforeunload', (event) => {
  if (dirty || transaction?.modified()) { event.preventDefault(); event.returnValue = ''; }
});

function frameNotice(text = '') {
  get('frame-status').hidden = !text;
  get('frame-status').textContent = text;
}
function sendPreview(type, more) {
  if (session?.ready) session.frame.contentWindow.postMessage({ type, nonce:session.nonce, ...more }, session.origin);
}
function renderPreview() {
  if (!visibleDraft) return;
  if (!session) {
    const url = new URL(model.siteUrl);
    url.searchParams.set('staff-editor', '4');
    const nonce = crypto.randomUUID();
    url.hash = 'staff-preview=' + nonce;
    const frame = node('iframe');
    frame.title = '婚禮工作指南即時預覽';
    frame.referrerPolicy = 'no-referrer';
    frame.src = url.href;
    session = { frame, nonce, origin:url.origin, ready:false, received:false };
    get('frame').replaceChildren(frame);
    frameNotice('正在開啟網站預覽…');
    session.timer = setTimeout(() => {
      if (!session?.received) frameNotice('預覽尚未回應。可從進階設定重新載入預覽。');
    }, 12000);
  }
  session.received = false;
  sendPreview('staff-preview-data', { data:visibleDraft, editing:Boolean(draft) && !previewOnly });
}
window.addEventListener('message', (event) => {
  if (!session || event.source !== session.frame.contentWindow || event.origin !== session.origin) return;
  const message = event.data;
  if (message?.nonce !== session.nonce) return;
  if (message.type === 'staff-preview-ready') {
    session.ready = true;
    renderPreview();
  } else if (message.type === 'staff-preview-rendered') {
    session.received = true;
    clearTimeout(session.timer);
    frameNotice();
  } else if (message.type === 'staff-preview-verified' && pendingVerification && message.request === pendingVerification.request) {
    pendingVerification.finish(message);
  } else if (message.type === 'staff-preview-edit' && session.received && draft && !previewOnly &&
      !busy && !checking && !get('panel').open) {
    selectContent(message.target);
  }
});
function setPreviewMode(only) {
  previewOnly = only;
  get('preview').setAttribute('aria-pressed', String(only));
  get('preview').textContent = only ? '返回編輯' : '預覽';
  get('navigation').hidden = only;
  renderPreview();
}
get('preview').onclick = () => { if (!busy && !checking) setPreviewMode(!previewOnly); };

async function applyState(result) {
  model = { ...model, ...result };
  draft = result.draft;
  dirty = false;
  get('setup').hidden = Boolean(draft);
  get('tools').hidden = !draft;
  get('retry').hidden = true;
  get('navigation').hidden = !draft || previewOnly;
  updateState();
  if (!draft) return;
  get('manager').hidden = false;
  try {
    visibleDraft = await rpc('preview', { data:draft });
    renderPreview();
    return visibleDraft;
  } catch (error) {
    frameNotice('無法更新預覽。' + (error.message || error));
  }
}
async function reload() {
  if (dirty && !await confirmAction('重新讀取會捨棄未儲存的修改。確定繼續？')) return;
  dismissPanel();
  await perform(async () => applyState(await rpc('load')), '讀取失敗');
  if (!model) get('retry').hidden = false;
}
get('retry').onclick = reload;
get('navigation').addEventListener('click', (event) => {
  const section = event.target.dataset.section;
  if (!section) return;
  selectedSection = section;
  get('navigation').querySelectorAll('[data-section]').forEach((item) =>
    item.setAttribute('aria-pressed', String(item.dataset.section === section)));
  sendPreview('staff-preview-navigate', { section });
});
get('library').onclick = showLibrary;
get('people').onclick = showPeople;

function panel(title) {
  get('panel-title').textContent = title;
  get('panel-body').replaceChildren();
  get('panel-actions').replaceChildren();
  get('panel-actions').hidden = true;
  if (!get('panel').open) get('panel').showModal();
  get('panel-body').scrollTop = 0;
  return get('panel-body');
}
async function closePanel() {
  if (checking || transaction?.modified() && !await confirmAction('捨棄這個視窗中尚未套用的修改？')) return;
  dismissPanel();
}
function dismissPanel() {
  transaction = null;
  get('panel').close();
}
get('close').onclick = closePanel;
get('panel').addEventListener('cancel', (event) => { event.preventDefault(); closePanel(); });

function namesIn(value, data) {
  const names = new Map(data.people.map(({ id, name }) => [id, name]));
  return String(value ?? '').replace(/\{person:([^{}]+)\}/g, (_, id) => names.get(id) || '（人員待確認）');
}
function optionsFor(type, data) {
  if (type === 'person') return data.people.map(({ id, name }) => [id, name]);
  if (type === 'team') return [...data.teams, ...(data.reception.groups || [])].map(({ id, name }) => [id, namesIn(name, data)]);
  if (type === 'event') return data.schedule.flatMap(({ events }) => events.map(({ id, time, title }) => [id, time + ' ' + namesIn(title, data)]));
  if (type === 'work') return teamWorkEntries(data).filter(({value}) => value?.id)
    .map(({team,value}) => [value.id,namesIn(team.name + ' · ' + value.text,data)]);
  return Object.entries(states);
}
function fresh(spec) {
  if (spec.type === 'workItem') return { text:'' };
  if (spec.type === 'object') return Object.fromEntries(Object.entries(spec.fields)
    .filter(([, field]) => !field.optional).map(([key, field]) => [key, fresh(field)]));
  if (spec.type === 'list') return [];
  if (spec.type === 'bool') return false;
  if (spec.type === 'status') return 'confirmed';
  if (spec.type === 'id') return 'item-' + crypto.randomUUID();
  return '';
}
function titleFor(item, spec, index, data) {
  if (typeof item === 'string') return namesIn(item, data);
  if (item.workId) return optionsFor('work',data).find(([id]) => id === item.workId)?.[1] || '引用組別工作';
  const person = data.people.find(({id}) => id === item.personId)?.name;
  if (item.to && person) return namesIn(item.to,data) + '（' + person + '）';
  return namesIn(item.name || item.title || item.label || item.date || item.role || item.moment ||
    item.text || person || spec.label + ' ' + (index + 1), data);
}
function appendFields(parent, specs, owner, path, data, preferred) {
  Object.entries(specs).forEach(([key, spec]) => renderField(parent, spec, owner, key, [...path,key], data, preferred));
}
function fieldLabel(spec, key) {
  return key === 'hidden' ? '顯示於網站' : friendly[key] || spec.label;
}
function renderField(parent, spec, owner, key, path, data, preferred) {
  if (spec.type === 'id' || spec.private && !transaction.private) return;
  if (spec.type === 'list' && spec.item.type === 'person') {
    renderMembers(parent, spec, owner, key, path, data, preferred);
    return;
  }
  if (spec.type === 'list' || spec.type === 'object') {
    const group = node('div');
    group.className = 'fields';
    const nested = spec.type === 'list' && (path.length > 1 || key === 'periods');
    const box = nested ? node('details') : group;
    if (nested) {
      box.append(node('summary', fieldLabel(spec, key)), group);
      box.open = preferred && path.every((part, index) => part === preferred[index]);
    } else group.append(node('h3', fieldLabel(spec, key)));
    parent.append(box);
    if (spec.type === 'list') renderList(group, spec, owner, key, path, data, preferred);
    else {
      const value = owner[key] || {};
      group.addEventListener('input', () => { owner[key] = value; });
      group.addEventListener('change', () => { owner[key] = value; });
      appendFields(group, spec.fields, value, path, data, preferred);
    }
    return;
  }
  const label = node('label');
  const caption = node('span', fieldLabel(spec, key));
  let control;
  if (spec.type === 'bool') {
    label.className = 'toggle';
    control = node('input');
    control.type = 'checkbox';
    control.checked = key === 'hidden' ? !owner[key] : Boolean(owner[key]);
    label.append(control, caption);
  } else {
    label.className = 'field';
    label.append(caption);
    if (['person','team','event','work','status'].includes(spec.type)) {
      control = node('select');
      if (spec.optional || !owner[key]) control.append(new Option(spec.optional ? '未指定' : '請選擇', ''));
      optionsFor(spec.type, data).forEach(([value, text]) => control.append(new Option(text, value)));
      control.value = owner[key] || '';
    } else {
      const original = spec.private ? String(owner[key] || '') : namesIn(owner[key], data);
      const multiline = spec.private || original.length > 42 || ['text','summary','detail','work','note'].includes(key);
      control = node(multiline ? 'textarea' : 'input');
      control.maxLength = spec.maxLength || (spec.private ? 12000 : 2500);
      control.value = original;
      if (multiline) control.rows = original.length > 110 ? 4 : 2;
    }
    label.append(control);
  }
  control.addEventListener('input', () => {
    if (spec.type === 'bool') owner[key] = key === 'hidden' ? !control.checked : control.checked;
    else if (!control.value && spec.optional && ['person','team','event','work','status'].includes(spec.type)) delete owner[key];
    else owner[key] = control.value;
  });
  parent.append(label);
  if (same(path, preferred)) transaction.focus = control;
}

function personNameKey(value) {
  return value.trim().normalize('NFKC').toLocaleLowerCase('zh-TW');
}
function newPerson(data, name) {
  const person = { id:'person-' + crypto.randomUUID(), name:name.trim() };
  data.people.push(person);
  return person;
}
function namePattern(person, data) {
  const escape = (value) => value.replace(/[.*+?^$\{\}()|[\]\\]/g, '\\$&');
  const duplicate = data.people.some(({id,name}) => id !== person.id && name === person.name);
  const token = '\\{person:' + escape(person.id) + '\\}';
  // A token for another person must never be mistaken for a free-text name.
  return new RegExp(duplicate || person.name.length < 2 ? token : token + '|\\{person:[^{}]+\\}|' + escape(person.name), 'g');
}
function rewriteMention(text, person, data, replacement) {
  return text.replace(namePattern(person,data), (match) =>
    match.startsWith('{person:') && match !== '{person:' + person.id + '}' ? match : replacement);
}
function mentionsPerson(text, person, data) {
  return rewriteMention(text,person,data,'') !== text;
}

function personLinks(data, person, schema) {
  const links = [];
  function visit(value, spec, owner, key, context, listRecord) {
    if (value === undefined || spec.private) return;
    if (spec.type === 'workItem') {
      if (typeof value === 'string') visit(value,spec.fields.text,owner,key,context,listRecord);
      else visit(value,{ ...spec, type:'object' },owner,key,context,listRecord);
      return;
    }
    if (spec.type === 'object') {
      Object.entries(spec.fields).forEach(([field,child]) =>
        visit(value[field],child,value,field,context,listRecord));
      return;
    }
    if (spec.type === 'list') {
      value.forEach((item,index) => {
        const title = spec.item.type === 'object' && (item.name || item.title || item.role || item.label || item.to || item.date || item.place);
        const path = [...context, title ? namesIn(title,data) : fieldLabel(spec,key)];
        visit(item,spec.item,value,index,path,{ items:value, item });
      });
      return;
    }
    const label = [...context,fieldLabel(spec,key)].filter(Boolean).join(' · ');
    if (spec.type === 'person' && value === person.id) {
      const removesRecord = !Array.isArray(owner) && !spec.optional;
      links.push({
        label, removesRecord, owner, key,
        unlink:() => {
          if (Array.isArray(owner)) owner.splice(owner.indexOf(person.id),1);
          else if (removesRecord) listRecord.items.splice(listRecord.items.indexOf(listRecord.item),1);
          else {
            delete owner[key];
            // A camera position can be kept with a pending operator.
            if (key === 'operatorId' && Object.hasOwn(owner,'device') && !owner.operator) owner.operator = '待公布';
          }
        }
      });
    } else if (spec.type === 'text' && typeof value === 'string' && mentionsPerson(value,person,data)) {
      links.push({ label, owner, key, text:value, update:(text) => { owner[key] = text; } });
    }
  }
  Object.entries(schema.fields).forEach(([key,spec]) => {
    if (key === 'people') return;
    const path = spec.type === 'object' ? [spec.label] : [];
    visit(data[key],spec,data,key,path,null);
  });
  return links;
}

function renamePerson(data, person, name, schema) {
  const chosen = name.trim();
  if (!chosen) throw new Error('請輸入姓名。');
  if (chosen === person.name) return;
  if (data.people.some((item) => item !== person && personNameKey(item.name) === personNameKey(chosen))) {
    throw new Error('名單已有這個姓名，請選用現有人員。');
  }
  // Keep existing assignments linked even when a legacy draft had plain names.
  personLinks(data,person,schema).filter((link) => link.text).forEach((link) =>
    link.update(rewriteMention(link.text,person,data,'{person:' + person.id + '}')));
  person.name = chosen;
}

function changeCandidate(data, team, person, replacement, promote) {
  const remaining = (team.candidateIds || []).filter((id) => id !== person.id);
  team.candidateIds = remaining;
  if (!promote && replacement && !remaining.includes(replacement.id)) remaining.push(replacement.id);
  if (promote && !team.memberIds.includes(replacement.id)) team.memberIds.push(replacement.id);
  const candidates = remaining.map((id) => data.people.find((item) => item.id === id)).filter(Boolean);
  const update = (text) => (text.match(/[^。！？\n]+[。！？\n]*|[。！？\n]+/g) || [])
    .map((sentence) => {
      if (!/待核對|待確認|候選|姓名未確認/.test(sentence) || !mentionsPerson(sentence,person,data)) return sentence;
      if (replacement && !promote && !mentionsPerson(sentence,replacement,data)) {
        return rewriteMention(sentence,person,data,'{person:' + replacement.id + '}');
      }
      if (!candidates.some((item) => mentionsPerson(sentence,item,data))) return '';
      const marker = '\u0000';
      return rewriteMention(sentence,person,data,marker)
        .replace(/\u0000\s*[、／/]/g,'').replace(/[、／/]\s*\u0000/g,'').replace(/\u0000/g,'');
    }).join('').trim();
  if (team.notes) team.notes = team.notes.map(update).filter(Boolean);
  for (const period of team.periods) {
    period.items = period.items.flatMap((item) => {
      const text = update(typeof item === 'string' ? item : item.text);
      return !text ? [] : [typeof item === 'string' ? text : { ...item, text }];
    });
  }
}

function personPicker(data, { label, selected = () => [], choose, create }) {
  const wrapper = node('div');
  wrapper.className = 'person-picker';
  const field = node('label');
  field.className = 'field';
  const input = node('input');
  input.type = 'search';
  input.autocomplete = 'off';
  input.placeholder = '輸入姓名';
  input.maxLength = 80;
  field.append(node('span',label),input);
  const suggestions = node('div');
  suggestions.className = 'suggestions';
  const status = node('p');
  status.className = 'muted';
  status.setAttribute('aria-live','polite');
  function finish(action) {
    action();
    input.value = '';
    update();
    input.focus();
  }
  function update() {
    suggestions.replaceChildren();
    status.textContent = '';
    const name = input.value.trim();
    if (!name) return;
    const query = personNameKey(name);
    const matches = data.people.filter((person) => personNameKey(person.name).includes(query));
    const exact = matches.filter((person) => personNameKey(person.name) === query);
    if (exact.length) status.textContent = '名單已有這個姓名。請從現有人員選取。';
    for (const person of [...exact,...matches.filter((item) => !exact.includes(item))].slice(0,6)) {
      const added = selected().includes(person.id);
      const option = button(person.name + (added ? '（已加入）' : ''),() => finish(() => choose(person)),'quiet option');
      option.disabled = added;
      suggestions.append(option);
    }
    if (!exact.length && create) suggestions.append(button('新增「' + name + '」',() => finish(() => create(name))));
    if (!matches.length && !create) status.textContent = '沒有符合的人員。';
  }
  input.addEventListener('input',update);
  input.addEventListener('keydown',(event) => {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    const options = suggestions.querySelectorAll('button:not([disabled])');
    if (options.length === 1) options[0].click();
    else options[0]?.focus();
  });
  wrapper.append(field,status,suggestions);
  return { wrapper,input };
}

function renderMembers(parent, spec, owner, key, path, data, preferred, onChange = () => {}, executionLabel) {
  const box = node('section');
  box.className = 'editor-section';
  const heading = executionLabel || (key === 'memberIds' ? '已加入組員' : fieldLabel(spec,key));
  const tags = node('div');
  tags.className = 'row member-tags';
  function draw() {
    tags.replaceChildren();
    const selected = owner[key] || [];
    if (!selected.length) tags.append(node('p','尚無' + (executionLabel || (key === 'memberIds' ? '組員' : heading))));
    selected.forEach((id) => {
      const person = data.people.find((item) => item.id === id);
      const tag = button((person?.name || '待公布') + ' ×',() => {
        owner[key] = selected.filter((value) => value !== id);
        draw();
        onChange();
        picker.input.focus();
      },'member-tag');
      tag.setAttribute('aria-label','從' + heading + '移除' + person?.name);

  const add = (person) => {
    owner[key] = [...(owner[key] || []),person.id];

    label:executionLabel ? '新增' + executionLabel : key === 'memberIds' ? '新增人員' : '新增' + heading,

    create:executionLabel ? undefined : (name) => add(newPerson(data,name))
  });
  box.append(node('h3',heading),tags,picker.wrapper);
  parent.append(box);
  if (same(path,preferred)) transaction.focus = picker.input;
  draw();
}

function renderLinks(parent, data, person, { onChange } = {}) {
  const list = node('ul');
  list.className = 'relations';
  function draw() {
    const links = personLinks(data,person,model.schema);
    list.replaceChildren();
    if (!links.length) {
      const empty = node('li','目前沒有其他工作關聯。');
      empty.className = 'muted';
      list.append(empty);
    }
    links.forEach((link) => {
      const row = node('li');
      row.append(node('p',link.label));
      if (link.text) {
        const details = node('details');
        const field = node('label');
        field.className = 'field';
        const value = node('textarea');
        value.rows = 2;
        const original = namesIn(link.text,data);
        value.value = original;
        field.append(node('span','調整這段文字以解除姓名關聯'),value);
        const feedback = node('p');
        feedback.className = 'error';
        details.append(node('summary',original),field,button('套用文字',() => {
          if (!value.value.trim() || mentionsPerson(value.value,person,data) || value.value === original) {
            feedback.textContent = '請調整這段文字，保留工作說明並移除這個姓名。';
            return;
          }
          link.update(value.value.trim());
          draw();
        }),feedback);
        row.append(details);
      } else row.append(button('解除此關聯',async () => {
        if (link.removesRecord && !await confirmAction('解除後會移除這筆工作安排。確定繼續？')) return;
        link.unlink();
        draw();
      },'quiet danger'));
      list.append(row);
    });
    onChange?.(links);
  }
  parent.append(list);
  draw();
}

function renderCandidates(parent, team, data, syncRoster) {
  const section = node('section');
  section.className = 'editor-section';
  const cards = node('div');
  const notices = node('div');
  const openRelations = new Map();
  function followUp(person) {
    if (!personLinks(data,person,model.schema).length) return;
    const box = node('details');
    box.open = true;
    box.append(node('summary',person.name + '的其他工作關聯'),
      node('p','已更新本組待確認名單。以下關聯仍保留，可逐筆檢視或解除。'));
    renderLinks(box,data,person);
    openRelations.get(person.id)?.remove();
    openRelations.set(person.id,box);
    notices.append(box);
  }
  function draw() {
    cards.replaceChildren();
    const ids = team.candidateIds || [];
    if (!ids.length) cards.append(node('p','目前沒有待確認人員。'));
    ids.forEach((id) => {
      const person = data.people.find((item) => item.id === id);
      if (!person) return;
      const row = node('details');
      row.className = 'candidate';
      const title = node('summary',person.name);
      title.setAttribute('aria-label','編輯待確認人員 ' + person.name);
      const name = node('input');
      name.value = person.name;
      name.maxLength = 80;
      const label = node('label');
      label.className = 'field';
      label.append(node('span','修改姓名'),name);
      const error = node('p');
      error.className = 'error';
      const actions = node('div');
      actions.className = 'row';
      const remove = async () => {
        if (!await confirmAction('從「' + namesIn(team.name,data) + '」移除待確認人員「' + person.name + '」及本組的相關待核對備註？')) return;
        changeCandidate(data,team,person,null,false);
        draw();
        followUp(person);
      };
      const promote = () => {
        changeCandidate(data,team,person,person,true);
        syncRoster();
        draw();
      };
      const updateName = () => {
        try {
          renamePerson(data,person,name.value,model.schema);
          title.textContent = person.name;
          title.setAttribute('aria-label','編輯待確認人員 ' + person.name);
          error.textContent = '';
          name.removeAttribute('aria-invalid');
          syncRoster();
        } catch (cause) {
          name.setAttribute('aria-invalid','true');
          error.textContent = cause.message;
        }
      };
      name.addEventListener('change',updateName);
      actions.append(button('確認為正式組員',promote),button('刪除待確認',remove,'quiet danger'));
      const replace = node('details');
      replace.append(node('summary','改選現有人員'));
      const picker = personPicker(data,{
        label:'對應的現有人員', selected:() => [id],
        choose:(match) => {
          changeCandidate(data,team,person,match,false);
          draw();
          followUp(person);
        }
      });
      replace.append(picker.wrapper);
      row.append(title,label,actions,error,replace);
      cards.append(row);
    });
  }
  function add(person) {
    team.candidateIds = [...(team.candidateIds || []),person.id];
    draw();
    syncRoster();
  }
  const picker = personPicker(data,{
    label:'新增待確認人員', selected:() => team.candidateIds || [],
    choose:add, create:(name) => add(newPerson(data,name))
  });
  section.append(node('h3','待確認人員'),cards,picker.wrapper,notices);
  parent.append(section);
  draw();
}

async function confirmDelete(title) {
  return await confirmAction('要刪除「' + title + '」嗎？') &&
    await confirmAction('請再次確認刪除「' + title + '」。');
}
function entryTools(container, array, index, title, redraw) {
  const controls = node('div');
  controls.className = 'row entry-tools';
  for (const [offset, label] of [[-1,'上移'],[1,'下移']]) {
    const move = button(label, () => {
      const destination = index + offset;
      [array[index], array[destination]] = [array[destination], array[index]];
      redraw(destination);
    });
    move.disabled = index + offset < 0 || index + offset >= array.length;
    controls.append(move);
  }
  controls.append(button('刪除', async () => {
    if (!await confirmDelete(title)) return;
    array.splice(index,1);
    redraw();
  }, 'danger quiet'));
  container.append(controls);
}

function renderList(parent, spec, owner, key, path, data, preferred) {
  const entries = node('div');
  entries.className = 'entries';
  const array = () => owner[key] || [];
  function draw(openIndex, focusPath) {
    entries.replaceChildren(...array().map((value, index) => {
      const itemPath = [...path,index];
      const row = node('details');
      row.open = index === openIndex;
      const heading = node('summary');
      const updateHeading = () => {
        const item = array()[index];
        heading.textContent = (item?.hidden ? '已隱藏｜' : '') + (titleFor(item, spec.item, index, data) || '新增項目');
      };
      updateHeading();
      row.append(heading);
      const fields = node('div');
      fields.className = 'fields';
      row.append(fields);
      row.addEventListener('input', updateHeading);
      if (spec.item.type === 'object' || spec.item.type === 'workItem') {
        const item = typeof value === 'string' ? { text:value } : value;
        if (item !== value) fields.addEventListener('input', () => { array()[index] = item; }, true);
        appendFields(fields, spec.item.fields, item, itemPath, data, focusPath);
      } else renderField(fields, spec.item, array(), index, itemPath, data, focusPath);
      entryTools(fields, array(), index, titleFor(value, spec.item, index, data) || '新增項目', (next) => draw(next));
      return row;
    }));
  }
  parent.append(entries, button('新增' + (spec.item.label === '說明' ? '一項說明' : spec.item.label), () => {
    if (!owner[key]) owner[key] = [];
    array().push(fresh(spec.item));
    draw(array().length - 1);
    entries.lastElementChild?.querySelector('input,textarea,select')?.focus();
  }));
  const next = preferred && path.every((part, index) => part === preferred[index]) ? preferred[path.length] : undefined;
  draw(next, preferred);
}

function textEditor(label, value, input, multiline = false) {
  const field = node('label');
  field.className = 'field';
  const control = node(multiline ? 'textarea' : 'input');
  control.value = value || '';
  if (multiline) control.rows = 2;
  control.addEventListener('input',() => input(control.value));
  field.append(node('span',label),control);
  return { field,control };
}

function teamWorkEntries(data) {
  return teamCollections(data).flat().flatMap((team) => team.periods.flatMap((period) =>
    period.items.map((value,index) => ({ team, period, value, index }))));
}
function scheduleEvents(data) {
  return data.schedule.flatMap(({ events }) => events);
}
function executionFields(parent, value, specs, data, onChange = () => {}) {
  const fields = node('div');
  fields.className = 'fields';
  for (const key of ['leaderId','place','time','phase']) renderField(fields, specs[key], value, key, [key], data);
  for (const control of fields.querySelectorAll('input, textarea, select')) control.addEventListener('input',onChange);
  renderMembers(fields, specs.memberIds, value, 'memberIds', ['executionMembers'], data, undefined, onChange, '工作人員');
  parent.append(fields);
}
function renderEventWork(parent, event, data, target) {
  const specs = model.schema.fields.schedule.item.fields.events.item.fields.work.item.fields;
  const section = node('details');
  section.className = 'editor-section';
  section.open = target.field === 'work';
  section.append(node('summary','詳細分工'), node('p','可引用組別既有工作，或為這項流程新增獨立工作。'));
  const list = node('div');
  list.className = 'entries';
  const notice = node('p');
  notice.className = 'muted';
  notice.setAttribute('role','status');
  const group = node('select');
  group.append(new Option('選擇組別',''), ...optionsFor('team',data).map(([id,label]) => new Option(label,id)));
  const tasks = node('select');
  const pickGroup = node('label');
  pickGroup.className = 'field';
  pickGroup.append(node('span','引用組別'),group);
  const pickTask = node('label');
  pickTask.className = 'field';
  pickTask.append(node('span','選擇組別工作'),tasks);

  let available = [];
  const append = (item) => {
    (event.work ||= []).push(item);
    draw(item.id);
  };
  const linkTask = button('引用所選工作',() => {
    const source = available[Number(tasks.value)];
    if (!source || tasks.value === '') return;
    const value = typeof source.value === 'string' ? { text:source.value } : source.value;
    value.id ||= fresh(specs.id);
    value.detailManaged = true;
    source.period.items[source.index] = value;
    append({ id:fresh(specs.id), workId:value.id });
  });
  function updatePicker() {
    const used = new Set(scheduleEvents(data).flatMap(({ work }) => (work || []).map(({workId}) => workId).filter(Boolean)));
    available = teamWorkEntries(data).filter(({ team, value }) => team.id === group.value && !used.has(value?.id));
    tasks.replaceChildren(new Option('選擇工作',''), ...available.map(({ period, value },index) =>
      new Option(namesIn((period.hidden || value?.hidden ? '未公開 · ' : '') + period.label + ' · ' +
        (typeof value === 'string' ? value : value.text),data),String(index))));
    tasks.disabled = !available.length;
    linkTask.disabled = true;
  }
  group.onchange = updatePicker;
  tasks.onchange = () => { linkTask.disabled = tasks.value === ''; };

  function draw(openId) {
    list.replaceChildren();
    if (!event.work?.length) list.append(node('p','尚未設定此流程的詳細工作。'));
    (event.work || []).forEach((item,index) => {
      const reference = item.workId && teamWorkEntries(data).find(({value}) => value?.id === item.workId);
      const value = reference ? reference.value : item;
      const row = node('details');
      row.open = item.id === openId;
      const heading = node('summary');
      const refreshHeading = () => {
        heading.textContent = (item.hidden ? '已隱藏 · ' : '') + (reference ? namesIn(reference.team.name,data) + ' · ' : '') +
          (namesIn(value.text,data) || '新工作');
      };
      row.append(heading);
      if (reference) row.append(node('p','修改內容、時間、地點或人員會同步到原組別與個人指南。這裡的顯示設定與刪除只影響詳細分工。'));
      else {
        renderField(row,specs.teamId,item,'teamId',['teamId'],data);
        row.append(node('p','發布後會同步出現在相關組別及符合分工的個人指南。'));
      }
      const field = textEditor('工作說明',namesIn(value.text,data),(text) => {
        value.text = text;
        refreshHeading();
      },true);
      row.append(field.field);
      executionFields(row,value,specs,data);
      const shown = node('label');
      shown.className = 'toggle';
      const visibility = node('input');
      visibility.type = 'checkbox';
      visibility.checked = !item.hidden;
      visibility.onchange = () => { item.hidden = !visibility.checked; refreshHeading(); };
      shown.append(visibility,node('span',reference ? '顯示於詳細分工' : '顯示於網站'));
      row.append(shown);
      const move = node('label');
      move.className = 'field';
      const destination = node('select');
      destination.append(new Option('目前流程',''), ...optionsFor('event',data).filter(([id]) => id !== event.id)
        .map(([id,label]) => new Option(label,id)));
      move.append(node('span','更改對應流程'),destination);
      const moveButton = button('移至所選流程',() => {
        const next = scheduleEvents(data).find(({id}) => id === destination.value);
        if (!next) return;
        (next.work ||= []).push(...event.work.splice(index,1));
        notice.textContent = '已移至「' + namesIn(next.title,data) + '」。套用後可到該流程繼續編輯。';
        draw();
      });
      moveButton.disabled = true;
      destination.onchange = () => { moveButton.disabled = !destination.value; };
      row.append(move,moveButton);
      entryTools(row,event.work,index,'詳細分工工作',(next) => draw(event.work[next]?.id));
      refreshHeading();
      list.append(row);
    });
    updatePicker();
  }
  const add = node('details');
  add.append(node('summary','引用組別既有工作'),pickGroup,pickTask,linkTask);
  section.append(list,notice,button('新增獨立工作',() => append({ id:fresh(specs.id), text:'' })),add);
  parent.append(section);
  draw(target.workId);
}

function removeDeletedWorkLinks(data, previous) {
  const ids = new Set(teamWorkEntries(data).flatMap(({value}) => value?.id ? [value.id] : []));
  const removed = new Set(teamWorkEntries(previous).flatMap(({value}) => value?.id && !ids.has(value.id) ? [value.id] : []));
  if (removed.size) for (const event of scheduleEvents(data)) {
    if (event.work) event.work = event.work.filter(({workId}) => !removed.has(workId));
  }
}

  function draw(openIndex, taskIndex) {
    periods.replaceChildren();

      show.append(showPeriod,node('span','整個時段顯示於網站'));
      options.append(linkField,show);
      entryTools(options,team.periods,index,'這個工作時段',draw);
      preview.append(when.field,list,button('新增工作',() => {
        const id = model.schema.fields.teams.item.fields.periods.item.fields.items.item.fields.id;

      row.append(title,preview);

function editPerson(id) {
  const original = draft.people.find((person) => person.id === id);
  edit(original ? '編輯人員 · ' + original.name : '新增工作人員',(parent,data) => {
    const person = data.people.find((item) => item.id === id);
    let name = person?.name || '';
    const field = textEditor('姓名',name,(value) => { name = value; hint(); });
    field.control.maxLength = 80;
    const warning = node('p');
    warning.className = 'error';
    function hint() {
      warning.textContent = data.people.some((item) => item !== person && personNameKey(item.name) === personNameKey(name))
        ? '名單已有這個姓名，請選用現有人員。' : '';
    }
    parent.append(field.field,warning);
    transaction.focus = field.control;
    transaction.pending = () => name !== (original?.name || '');
    if (!person) {
      transaction.prepare = (candidate) => {
        if (!name.trim() || warning.textContent) throw new Error(warning.textContent || '請輸入姓名。');
        newPerson(candidate,name);
      };
      return;
    }
    transaction.prepare = (candidate) => {
      const item = candidate.people.find((entry) => entry.id === id);
      if (item) renamePerson(candidate,item,name,model.schema);
    };
    const remove = button('刪除此人員',async () => {
      if (!await confirmAction('確定從全站人員名單刪除「' + name + '」？')) return;
      data.people.splice(data.people.indexOf(person),1);
      parent.replaceChildren(node('p','此人員將從名單移除。按「套用修改」更新草稿。'));
    },'danger');
    const note = node('p');

    parent.append(node('h3','目前的組別與工作關聯'));
    renderLinks(parent,data,person,{ onChange:(links) => {
      remove.disabled = links.length > 0;
      note.textContent = links.length ? '刪除整位人員前，請逐筆解除仍在使用的關聯。' : '目前可以刪除此人員。';
    } });
    parent.append(note,remove);
  });
}

function edit(title, draw, preferred, privateFields = false) {
  const data = copy(draft);
  const body = panel(title);
  transaction = { data, private:privateFields, modified:() => !same(data,draft) || Boolean(transaction.pending?.()) };
  const fields = node('div');
  fields.className = 'fields';
  draw(fields, data, preferred);
  body.append(fields);
  const errorText = node('p');
  errorText.id = 'form-error';
  errorText.className = 'error';
  errorText.setAttribute('role', 'alert');
  body.append(errorText);
  const apply = button('套用修改', async () => {
    if (checking) return;
    if (!transaction.modified() && !transaction.prepare) { dismissPanel(); return; }
    checking = true;
    get('panel').inert = true;
    updateState();
    errorText.textContent = '';
    try {
      if (fields.querySelector('[aria-invalid="true"]')) throw new Error('請先修正標示的人員姓名。');
      const candidate = copy(data);
      transaction.prepare?.(candidate);
      removeDeletedWorkLinks(candidate,draft);
      if (same(candidate,draft)) { dismissPanel(); return; }
      const projected = await rpc('preview', { data:candidate });
      draft = candidate;
      visibleDraft = projected;
      dirty = true;
      dismissPanel();
      renderPreview();
      message();
    } catch (error) {
      errorText.textContent = '無法套用。' + (error.message || String(error));
      errorText.scrollIntoView({ block:'nearest' });
    } finally {
      checking = false;
      get('panel').inert = false;
      updateState();
    }
  }, 'primary');
  get('panel-actions').replaceChildren(button('取消', closePanel), apply);
  get('panel-actions').hidden = false;
  transaction.focus?.focus();
}

function editRecord(area, id, field, target = {}, create = false) {
  const weddingDay = draft.schedule.find((day) => day.id === target.dayId) || draft.schedule.find((day) => day.id === 'wedding-day') || draft.schedule[0];
  const collection = (data) => {
    if (area === 'event') return data.schedule.find((day) => day.id === weddingDay?.id)?.events;
    if (area === 'team') return target.reception || teamCollections(data)[1].some((item) => item.id === id)
      ? (data.reception.groups ||= []) : data.teams;
    return data.cameraPositions;
  };
  const specs = model.schema.fields;
  const spec = area === 'event' ? specs.schedule.item.fields.events.item
    : area === 'team' ? specs.teams.item : specs.cameraPositions.item;
  const original = area === 'event' ? draft.schedule.flatMap(({events}) => events).find((item) => item.id === id)
    : collection(copy(draft))?.find((item) => item.id === id);
  if (!original && !create) return;
  const title = (create ? '新增' : '編輯') + ' ' + (original ? titleFor(original,spec,0,draft) : spec.label);
  const eventDay = original && area === 'event' ? draft.schedule.find((day) => day.events.includes(original)) : weddingDay;
  let preferred = field ? [field] : undefined;
  if (area === 'event' && field === 'details' && Number.isInteger(target.index)) preferred = [field,target.index];
  if (area === 'team' && Number.isInteger(target.periodIndex)) {
    const period = original.periods.filter((item) => !item.hidden)[target.periodIndex];
    if (period) {
      const sourceIndex = period.items.flatMap((item,index) => item?.hidden ? [] : [index])[target.itemIndex] ?? -1;
      preferred = sourceIndex >= 0 ? ['periods',original.periods.indexOf(period),'items',sourceIndex,'text']
        : ['periods',original.periods.indexOf(period),'label'];
    }
  }
  edit(title, (parent, data) => {
    const list = area === 'event' ? data.schedule.find((day) => day.id === eventDay?.id)?.events : collection(data);
    if (!list) { parent.append(node('p','請先在進階設定新增婚禮日期。')); return; }
    const index = create ? list.push(fresh(spec)) - 1 : list.findIndex((item) => item.id === id);
    const record = list[index];
    const extras = area === 'event' ? ['overviewHidden','guideTeamIds','featured','details','note'] : [];
    if (area === 'team') renderTeamForm(parent,record,data,preferred);
    else Object.entries(spec.fields).filter(([key]) => key !== 'work' && !extras.includes(key))
      .forEach(([key, definition]) => renderField(parent, definition, record, key, [key], data, preferred));
    if (area === 'event' && spec.fields.work) renderEventWork(parent,record,data,target);
    if (extras.length) {
      const options = node('details');
      options.append(node('summary','補充說明及顯示設定'));
      options.open = extras.includes(preferred?.[0]);
      extras.forEach((key) => renderField(options, spec.fields[key], record, key, [key], data, preferred));
      parent.append(options);
    }
    if (field === 'overviewTitle' && typeof target.overviewLabel === 'string' && transaction.focus) {
      transaction.focus.placeholder = target.overviewLabel;
    }
    const refreshTools = (next) => {
      const tools = parent.querySelector(':scope > .entry-tools');
      tools?.remove();
      if (next === undefined) {
        parent.replaceChildren(node('p','此項目將從草稿刪除。請套用修改。'));
      } else entryTools(parent, list, next, titleFor(record,spec,next,data), refreshTools);
    };
    if (!create && area === 'team') {
      const controls = node('details');
      controls.append(node('summary','組別順序及刪除'));
      parent.append(controls);
      const redraw = (next) => {
        if (next === undefined) parent.replaceChildren(node('p','此組別將從草稿刪除。請套用修改。'));
        else {
          controls.querySelector('.entry-tools')?.remove();
          entryTools(controls,list,next,namesIn(record.name,data),redraw);
        }
      };
      redraw(index);
    } else if (!create) {
      refreshTools(index);
    }
  }, preferred);
}

async function backupFile(input) {
  const file = input.files[0];
  if (!file || file.size > 1100000) throw new Error('請選擇可用的婚禮資料 JSON 檔案。');
  let backup;
  try { backup = JSON.parse(await file.text()); }
  catch { throw new Error('這份檔案的 JSON 格式有誤。'); }
  return backup?.data || backup;
}

  get('seed-info').textContent = '資料已驗證，可以查看下方預覽。';
  get('manager').hidden = false;
  renderPreview();
},'讀取失敗');
get('initialize').onclick = () => perform(async () => {
  if (!seedReview) return;
  await applyState(await rpc('initialize',{ revision:model.revision, data:seedReview }));
  seedReview = null;
},'建立草稿失敗');
get('save').onclick = () => perform(async () => {
  if (!dirty) return;
  await applyState(await rpc('save',{ revision:model.revision, data:draft }));
  message('草稿已儲存。');
},'儲存失敗，修改仍保留在畫面上');
function describeChange(value, spec, data) {
  if (value === undefined || value === null || value === '') return '—';
  if (spec.type === 'bool') return value ? '是' : '否';
  if (['person','team','event','work','status'].includes(spec.type)) {
    return optionsFor(spec.type,data).find(([id]) => id === value)?.[1] || '未指定';
  }
  if (spec.type === 'workItem') return namesIn(typeof value === 'string' ? value : value.text,data);
  if (spec.type === 'list') {
    return value.map((item) => describeChange(item,spec.item,data)).join('、') || '—';
  }
  if (spec.type === 'object') {
    return Object.entries(spec.fields).filter(([key,child]) =>
      child.type !== 'id' && child.type !== 'bool' && !child.private && value[key] !== undefined
    ).map(([key,child]) => fieldLabel(child,key) + '　' + describeChange(value[key],child,data)).join('\n') || '—';
  }
  return namesIn(value,data);
}

function pairRecords(before, after) {
  const used = new Set();
  const pairs = after.map((item,newIndex) => ({ item,newIndex,oldIndex:-1 }));
  const identity = (item) => item && typeof item === 'object' &&
    (item.id || item.title || item.name || item.label || item.role || item.moment || item.personId);
  for (const matches of [
    (a,b) => Boolean(a?.id) && a.id === b?.id,
    (a,b) => same(a,b),
    (a,b) => Boolean(identity(a)) && identity(a) === identity(b),
    (a,b) => !a?.id && !b?.id
  ]) {
    for (const pair of pairs) {
      if (pair.oldIndex !== -1) continue;
      const index = before.findIndex((item,i) => !used.has(i) && matches(item,pair.item));
      if (index !== -1) { pair.oldIndex = index; used.add(index); }
    }
  }
  return { pairs, removed:before.map((item,index) => ({ item,index })).filter(({ index }) => !used.has(index)) };
}

function reviewChanges(before, after, schema) {
  if (!before) return [{ title:'首次發布', before:'尚未有公開版本',
    after:after.people.length + ' 位人員、' + after.teams.length + ' 個組別及目前的婚禮工作指南' }];
  const entries = [];
  let privateChanged = false;
  const add = (title, before, after) => entries.push({ title, before, after });
  function walk(a,b,spec,path,key) {
    if (spec.private) { privateChanged ||= !same(a,b); return; }
    if (spec.type === 'id') return;
    const label = fieldLabel(spec,key);
    const title = [...path,label].join('／');
    if (spec.type === 'bool') {
      if (Boolean(a) !== Boolean(b)) {
        const visibility = key === 'hidden' || key === 'overviewHidden' || key === 'indexHidden' || path[0] === '網站區塊顯示設定';
        add(title,visibility ? (a ? '隱藏' : '顯示') : describeChange(!!a,spec,before),
          visibility ? (b ? '隱藏' : '顯示') : describeChange(!!b,spec,after));
      }
      return;
    }
    if (spec.type === 'workItem') {
      walk(typeof a === 'string' ? { text:a } : a,typeof b === 'string' ? { text:b } : b,
        { ...spec,type:'object' },path,key);
      return;
    }
    if (spec.type === 'object') {
      Object.entries(spec.fields).forEach(([field,definition]) => walk(a?.[field],b?.[field],definition,[...path,label],field));
      return;
    }
    if (spec.type === 'list' && ['object','workItem'].includes(spec.item.type)) {
      const oldItems = a || [];
      const { pairs,removed } = pairRecords(oldItems,b || []);
      const context = ['people','management','assignments','work'].includes(key) ? [...path,label] : path;
      for (const { item,index } of removed) {
        add([...context,titleFor(item,spec.item,index,before),'已刪除'].join('／'),describeChange(item,spec.item,before),'—');
      }
      for (const {item,oldIndex,newIndex} of pairs) {
        const name = titleFor(item,spec.item,newIndex,after);
        if (oldIndex < 0) add([...context,name,'新增'].join('／'),'—',describeChange(item,spec.item,after));
        else walk(oldItems[oldIndex],item,{ ...spec.item,label:name },context,'');
      }
      const matched = pairs.filter(({oldIndex}) => oldIndex >= 0);
      const oldOrder = [...matched].sort((a,b) => a.oldIndex - b.oldIndex);
      if (matched.some((item,index) => item.oldIndex !== oldOrder[index].oldIndex)) {
        add(title + '／順序',
          oldOrder.map(({oldIndex}) => titleFor(oldItems[oldIndex],spec.item,oldIndex,before)).join(' → '),
          matched.map(({item,newIndex}) => titleFor(item,spec.item,newIndex,after)).join(' → '));
      }
      return;
    }
    if (spec.type === 'list' && spec.item.type === 'text' && !same(a || [],b || [])) {
      const oldText = (a || []).map((item) => namesIn(item,before));
      const newText = (b || []).map((item) => namesIn(item,after));
      if (!same(oldText,newText)) add(title,oldText.join('\n') || '—',newText.join('\n') || '—');
      return;
    }
    if (spec.type === 'list' && spec.item.type === 'person' && !same(a || [],b || [])) {
      const oldIds = a || [];
      const newIds = b || [];
      const previous = oldIds.filter((id) => !newIds.includes(id));
      const added = newIds.filter((id) => !oldIds.includes(id));
      const group = path.join('／');
      const role = key === 'candidateIds' ? '待確認人員' : label;
      if (previous.length) add(group + '／已移除' + role + '：' + describeChange(previous,spec,before),
        describeChange(oldIds,spec,before),describeChange(newIds,spec,after));
      if (added.length) add(group + '／已新增' + role + '：' + describeChange(added,spec,after),
        describeChange(oldIds,spec,before),describeChange(newIds,spec,after));
      if (previous.length || added.length) return;
    }
    if (same(a,b)) return;
    const oldText = describeChange(a,spec,before);
    const newText = describeChange(b,spec,after);
    if (oldText !== newText) add(title,oldText,newText);
  }
  Object.entries(schema.fields).forEach(([key,spec]) => walk(before[key],after[key],spec,[],key));
  if (privateChanged) add('內部備註','上一版備註','已更新，僅管理者可見');
  return entries;
}

function checkPublicVersion(release) {
  if (!session?.ready) return Promise.resolve({ error:'預覽尚未連線' });
  const request = crypto.randomUUID();
  return new Promise((resolve) => {
    const finish = (result) => {
      clearTimeout(timer);
      pendingVerification = null;
      resolve(result);
    };
    const timer = setTimeout(() => finish({ error:'公開資料讀取逾時' }),12000);
    pendingVerification = { request,finish };
    sendPreview('staff-preview-verify',{ request, version:release.version, expected:release.data });
  });
}

async function verifyPublication(release) {
  release.verified = null;
  updateState();
  let result;
  try {
    if (!release.data) {
      const saved = await rpc('export',{ version:release.version });
      release.data = await rpc('preview',{ data:saved.data });
    }
    result = await checkPublicVersion(release);
    if (result.error === '預覽尚未連線' || Number.isSafeInteger(result.version) && result.version < release.version) {
      await new Promise((resolve) => setTimeout(resolve,1250));
      result = await checkPublicVersion(release);
    }
  } catch (error) {
    result = { error:error.message || String(error) };
  }
  release.verified = result.matches === true;
  updateState();
  if (release.verified) {
    message('發布成功，已確認公開網站取得這次更新。');
    return;
  }
  const reason = result.error || (result.version > release.version ? '公開端已有較新的版本' : '公開資料與這次發布的版本或內容不同');
  message('發布已寫入，公開驗證失敗。' + reason + '。',true);
}
get('verify-again').onclick = () => perform(() => verifyPublication(lastPublication),'公開驗證失敗');

function showReview(comparison) {
  const body = panel('發布前確認');
  const changes = reviewChanges(comparison.before,comparison.after,model.schema);
  body.append(node('p',changes.length ? '請核對草稿與最新發布版本的變更。' : '目前草稿與最新發布版本沒有內容差異。'));
  const list = node('ul');
  list.className = 'changes';
  for (const change of changes) {
    const item = node('li');
    const values = node('dl');
    values.append(node('dt','修改前'),node('dd',change.before),node('dt','修改後'),node('dd',change.after));
    item.append(node('h3',change.title),values);
    list.append(item);
  }
  body.append(list);
  const summary = node('input');
  summary.id = 'publish-summary';
  summary.maxLength = 160;
  const label = node('label');
  label.className = 'field';
  label.append(node('span','更新摘要（選填）'),summary);
  body.append(label);
  get('panel-actions').hidden = false;
  get('panel-actions').append(button('取消',closePanel),button('確認發布',async () => {
    if (busy) return;
    dismissPanel();
    await perform(async () => {
      const state = await rpc('publish',{ revision:comparison.revision, summary:summary.value });
      lastPublication = { version:state.published.version, verified:null };
      lastPublication.data = await applyState(state);
      await verifyPublication(lastPublication);
    },'發布失敗，伺服器草稿仍保留');
  },'primary'));
}
get('publish').onclick = () => {
  if (dirty) { message('請先儲存草稿，再比較差異及發布。', true); return; }
  return perform(async () => showReview(await rpc('review',{ revision:model.revision })),'無法取得發布差異');
};
reload();
</script>
</body>
