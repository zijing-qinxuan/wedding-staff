<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <style>
    :root { color-scheme: light; --paper:#fffdf7; --bg:#f6f2e9; --ink:#342f29; --gold:#725224; --line:#dacfbb; --error:#8c352c; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,"PingFang TC",sans-serif; }
    [hidden] { display:none !important; } main { max-width:1080px; margin:auto; padding:1.2rem; } p { margin:.55rem 0; }
    h1,h2 { font-family:"Noto Serif TC","Songti TC",serif; } h1 { margin:0; font-size:clamp(1.8rem,5vw,2.8rem); } h2 { margin:.2rem 0 .65rem; }
    header, section, .toolbar, nav { margin-bottom:1rem; } header p { color:#665d4f; }
    button, input, textarea, select, .link { font:inherit; color:inherit; min-height:44px; }
    button, .link { border:1px solid var(--line); padding:.38rem .8rem; border-radius:.55rem; background:var(--paper); cursor:pointer; }
    button.primary { background:var(--gold); color:#fff; border-color:var(--gold); } button:disabled { opacity:.5; cursor:default; }
    button[aria-pressed="true"] { border-color:var(--gold); box-shadow:inset 0 -3px var(--gold); }
    button.danger { color:var(--error); } button:focus-visible, :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
    .toolbar, nav, .row-actions { display:flex; gap:.45rem; flex-wrap:wrap; align-items:center; }
    .status { border-left:3px solid var(--gold); padding:.55rem .8rem; background:var(--paper); white-space:pre-wrap; overflow-wrap:anywhere; }
    .status.error { color:var(--error); border-color:var(--error); } .muted { color:#665d4f; font-size:.92rem; }
    .panel, fieldset, .entries > details, .value-row { background:var(--paper); border:1px solid var(--line); border-radius:.7rem; padding:.75rem .9rem; min-width:0; }
    fieldset, .entries { margin:.75rem 0; } legend { font-weight:700; color:var(--gold); padding:0 .35rem; }
    label.field { display:block; margin:.55rem 0; } label.field > span { display:block; font-weight:600; }
    input:not([type=checkbox]), textarea, select { width:100%; border:1px solid var(--line); background:white; padding:.42rem .6rem; border-radius:.4rem; }
    input[type=checkbox] { min-height:0; width:1.25rem; height:1.25rem; vertical-align:middle; margin-right:.4rem; accent-color:var(--gold); }
    label.toggle { display:flex; align-items:center; min-height:44px; } textarea { resize:vertical; } code { overflow-wrap:anywhere; }
    .entries > details, .value-row { margin:.45rem 0; } .entries > details > summary { min-height:44px; cursor:pointer; padding:.35rem 0; font-weight:650; overflow-wrap:anywhere; }
    .entries { list-style:none; padding:0; } .value-row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
    .value-row .field { flex:1 1 220px; margin:0; } .row-actions { margin:.35rem 0; }
    .work-item-fields { flex:1 1 250px; min-width:0; }
    .section-heading { display:flex; justify-content:space-between; flex-wrap:wrap; gap:.5rem; align-items:center; }
    .history { padding:0; list-style:none; } .history li { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.5rem; border-top:1px solid var(--line); padding:.5rem 0; }
    iframe { width:100%; height:72vh; border:1px solid var(--line); border-radius:.6rem; background:var(--paper); }
    dialog { max-width:min(90vw,30rem); padding:1rem; background:var(--paper); color:var(--ink); border:1px solid var(--line); border-radius:.7rem; }
    dialog::backdrop { background:#342f2950; }
    dialog .toolbar { margin:.9rem 0 0; justify-content:flex-end; }
    input[type=file] { margin:.5rem 0; } small { font-size:.85rem; } .field small { display:block; }
    @media(max-width:520px) { main { padding:.7rem; } fieldset, .panel, .entries > details, .value-row { padding:.5rem; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>婚禮工作指南管理</h1>
    <p id="versions" aria-live="polite"></p>
  </header>
  <p class="status" id="status" role="status">正在讀取婚禮資料…</p>
  <div class="toolbar" id="reload-controls"><button type="button" id="reload">重新讀取草稿</button></div>
  <section id="setup" class="panel" hidden>
    <h2>建立第一份草稿</h2>
    <p>選擇從目前工作指南匯出的初始化 JSON。</p>
    <input id="seed" aria-label="婚禮資料 JSON" type="file" accept=".json,application/json">
    <div class="toolbar"><button type="button" id="review-seed">讀取並檢視</button><button type="button" id="initialize" class="primary" disabled>建立草稿</button></div>
    <p id="seed-info" class="muted"></p>
  </section>
  <div id="manager" hidden>
    <div class="toolbar">
      <button type="button" id="save" class="primary">儲存草稿</button>
      <button type="button" id="preview">預覽</button>
      <button type="button" id="publish">發布</button>
      <button type="button" id="export">匯出已儲存草稿</button>
      <button type="button" id="export-local">匯出目前修改</button>
    </div>
    <p class="muted">可見欄位會公開給工作人員。私人資料請填在內部備註，或把該項目設為隱藏。</p>
    <nav id="tabs" aria-label="編輯區塊"></nav>
    <section class="panel" id="workspace" aria-labelledby="section-name">
      <div class="section-heading"><h2 id="section-name"></h2><button type="button" id="edit">✎ 編輯</button></div>
      <div id="fields" hidden></div>
    </section>
    <section class="panel" id="preview-panel" hidden>
      <div class="section-heading"><h2>草稿預覽</h2><button type="button" id="close-preview">關閉預覽</button></div>
      <div id="preview-frame"></div>
    </section>
    <details class="panel"><summary>發布紀錄與還原</summary><ul class="history" id="history"></ul></details>
  </div>
</main>
<dialog id="confirmation" aria-labelledby="confirm-message">
  <p id="confirm-message"></p>
  <form class="toolbar" method="dialog">
    <button value="cancel" autofocus>取消</button>
    <button class="primary" id="confirm-yes" value="confirm">確認</button>
  </form>
</dialog>
<script>
'use strict';
const get = (id) => document.getElementById(id);
const tabs = [
  ['總流程', ['schedule', 'keyTimes']],
  ['人員及兼任', ['people', 'management', 'assignments']],
  ['工作組別', ['teams']],
  ['節目及影音', ['ceremony', 'cameraPositions', 'avCues', 'avInfo', 'avChecklist', 'equipment']],
  ['攝影及合照', ['photoGroups', 'photoServices']],
  ['撤場及婚宴', ['cleanup', 'reception']],
  ['顯示及其他資訊', ['sections', 'weddingInfo', 'venues', 'seating', 'privateNotes']]
];
const states = { confirmed:'已確認', tentative:'暫定', pending:'待公布' };
let model = null;
let draft;
let dirty = false;
let busy = false;
let selectedTab = 0;
let editing = false;
let seedReview = null;
let previewSession = null;

function node(tag, text) {
  const element = document.createElement(tag);
  if (text !== undefined) element.textContent = text;
  return element;
}
function button(text, click, className = '') {
  const item = node('button', text);
  item.type = 'button';
  item.className = className;
  item.onclick = click;
  return item;
}
function message(text, error = false) {
  get('status').textContent = text;
  get('status').classList.toggle('error', error);
}
function requestConfirmation(text) {
  const dialog = get('confirmation');
  dialog.returnValue = '';
  get('confirm-message').textContent = text;
  dialog.showModal();
  return new Promise((resolve) => {
    dialog.addEventListener('close', () => resolve(dialog.returnValue === 'confirm'), { once:true });
  });
}
function rpc(action, payload = {}) {
  return new Promise((resolve, reject) =>
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).adminRequest(action, payload)
  );
}
async function perform(work) {
  if (busy) return;
  busy = true;
  document.querySelectorAll('button, input, textarea, select').forEach((control) => {
    control.dataset.wasDisabled = String(control.disabled);
    control.disabled = true;
  });
  try { await work(); }
  catch (error) { message(error.message || String(error), true); }
  finally {
    busy = false;
    document.querySelectorAll('[data-was-disabled]').forEach((control) => {
      control.disabled = control.dataset.wasDisabled === 'true';
      delete control.dataset.wasDisabled;
    });
    get('initialize').disabled = !seedReview;
  }
}
function formatTime(value) {
  return value ? new Date(value).toLocaleString('zh-TW', { timeZone:'Asia/Taipei', hour12:false }) : '尚未儲存';
}
function updateVersions() {
  if (!model) return;
  const published = model.published ? 'v' + model.published.version + '・' + formatTime(model.published.updatedAt) : '尚未發布';
  get('versions').textContent = (dirty ? '有未儲存的修改' : '草稿 ' + formatTime(model.draftUpdatedAt)) + '｜公開版本 ' + published;
}
function changed() { dirty = true; updateVersions(); }
window.addEventListener('beforeunload', (event) => {
  if (dirty) { event.preventDefault(); event.returnValue = ''; }
});

function applyState(result) {
  closePreview();
  model = { ...model, ...result };
  draft = result.draft;
  dirty = false;
  get('setup').hidden = Boolean(draft);
  get('manager').hidden = !draft;
  updateVersions();
  if (draft) {
    renderTabs();
    renderSection();
    renderHistory();
  }
}
function renderTabs() {
  get('tabs').replaceChildren(...tabs.map(([title], index) => {
    const item = button(title, () => {
      if (busy) return;
      selectedTab = index;
      editing = false;
      renderTabs();
      renderSection();
    });
    item.setAttribute('aria-pressed', String(index === selectedTab));
    return item;
  }));
}
function renderSection() {
  const [title, keys] = tabs[selectedTab];
  get('section-name').textContent = title;
  get('edit').textContent = editing ? '收合編輯' : '✎ 編輯';
  get('edit').setAttribute('aria-expanded', String(editing));
  get('fields').hidden = !editing;
  get('fields').replaceChildren();
  if (editing) keys.forEach((key) => renderField(get('fields'), model.schema.fields[key], draft, key));
}
get('edit').onclick = () => { editing = !editing; renderSection(); };

function optionsFor(type) {
  if (type === 'person') return draft.people.map(({ id, name }) => [id, name + '（' + id + '）']);
  if (type === 'team') return [...draft.teams, ...(draft.reception.groups || [])].map(({ id, name }) => [id, name]);
  if (type === 'event') return draft.schedule.flatMap(({ date, events }) => events.map(({ id, time, title }) => [id, date + ' ' + time + ' ' + title]));
  return Object.entries(states);
}
function fresh(spec) {
  if (spec.type === 'workItem') return { text: '' };
  if (spec.type === 'object') {
    return Object.fromEntries(Object.entries(spec.fields).filter(([, field]) => !field.optional).map(([key, field]) => [key, fresh(field)]));
  }
  if (spec.type === 'list') return [];
  if (spec.type === 'bool') return false;
  if (spec.type === 'status') return 'confirmed';
  if (spec.type === 'id') return 'item-' + crypto.randomUUID();
  return '';
}
function titleFor(item, spec, index) {
  const name = item.name || item.title || item.label || item.date || item.role || item.moment ||
    (item.personId && draft.people.find(({ id }) => id === item.personId)?.name) || item.id || (spec.label + ' ' + (index + 1));
  return (item.hidden ? '（已隱藏）' : '') + name.replace(/\{person:([^{}]+)\}/g, (_, id) => draft.people.find((person) => person.id === id)?.name || id);
}
function renderField(parent, spec, owner, key) {
  if (spec.type === 'object' || spec.type === 'list') {
    const box = node('fieldset');
    box.append(node('legend', spec.label));
    parent.append(box);
    if (spec.type === 'list') {
      renderList(box, spec, owner, key);
    } else {
      const value = owner[key] || {};
      Object.entries(spec.fields).forEach(([childKey, field]) => {
        if (!owner[key]) {
          const wrapper = node('div');
          wrapper.addEventListener('input', () => { owner[key] = value; });
          box.append(wrapper);
          renderField(wrapper, field, value, childKey);
        } else renderField(box, field, value, childKey);
      });
    }
    return;
  }
  const label = node('label');
  label.className = spec.type === 'bool' ? 'toggle' : 'field';
  let control;
  if (spec.type === 'bool') {
    control = node('input');
    control.type = 'checkbox';
    control.checked = owner[key] === true;
    label.append(control, node('span', spec.label));
  } else {
    label.append(node('span', spec.label));
    if (['person', 'team', 'event', 'status'].includes(spec.type)) {
      control = node('select');
      control.append(new Option('請選擇', ''));
      optionsFor(spec.type).forEach(([value, title]) => control.append(new Option(title, value)));
      if (owner[key] && ![...control.options].some((option) => option.value === owner[key])) {
        control.append(new Option('找不到 ' + owner[key], owner[key]));
      }
    } else {
      control = node(spec.type === 'id' ? 'input' : 'textarea');
      if (spec.type === 'id') control.readOnly = true;
      else {
        control.rows = String(owner[key] || '').length > 55 || spec.private ? 3 : 1;
        control.maxLength = spec.maxLength || (spec.private ? 12000 : 2500);
      }
    }
    control.value = owner[key] || '';
    label.append(control);
  }
  control.addEventListener('input', () => {
    owner[key] = spec.type === 'bool' ? control.checked : control.value;
    changed();
  });
  parent.append(label);
  if (spec.type === 'text' && !spec.private && /\{person:/.test(control.value)) {
    label.append(node('small', '人員代碼會在公開頁顯示對應姓名，修改姓名時會同步更新。'));
  }
}

function renderList(box, spec, owner, key) {
  const entries = node('div');
  entries.className = 'entries';
  const array = () => owner[key] || [];
  function draw(openIndex) {
    entries.replaceChildren();
    array().forEach((value, index) => {
      const isWork = spec.item.type === 'workItem';
      const isObject = spec.item.type === 'object';
      const row = node(isObject ? 'details' : 'div');
      if (isObject) {
        row.open = index === openIndex;
        row.append(node('summary', titleFor(value, spec.item, index)));
      } else row.className = 'value-row';
      const actions = node('div');
      actions.className = 'row-actions';
      function move(offset) {
        const target = index + offset;
        [array()[index], array()[target]] = [array()[target], array()[index]];
        changed();
        draw(target);
      }
      const up = button('上移', () => move(-1));
      const down = button('下移', () => move(1));
      up.disabled = index === 0;
      down.disabled = index === array().length - 1;
      actions.append(up, down, button('刪除', async () => {
        if (!await requestConfirmation('確定從草稿刪除這一項？')) return;
        if (!await requestConfirmation('請再次確認刪除。修改會在儲存草稿後同步。')) return;
        array().splice(index, 1);
        changed();
        draw();
      }, 'danger'));
      if (isObject) {
        row.append(actions);
        Object.entries(spec.item.fields).forEach(([fieldKey, field]) => renderField(row, field, value, fieldKey));
        row.addEventListener('input', () => { row.querySelector('summary').textContent = titleFor(value, spec.item, index); });
      } else if (isWork) {
        const item = typeof value === 'string' ? { text: value } : value;
        const fields = node('div');
        fields.className = 'work-item-fields';
        Object.entries(spec.item.fields).forEach(([fieldKey, field]) => renderField(fields, field, item, fieldKey));
        fields.addEventListener('input', () => { array()[index] = item; });
        row.append(fields, actions);
      } else {
        renderField(row, spec.item, array(), index);
        row.append(actions);
      }
      entries.append(row);
    });
  }
  box.append(entries, button('新增' + (spec.item.type === 'object' ? spec.item.label : spec.item.label === '人員' ? '人員' : '一項'), () => {
    if (!owner[key]) owner[key] = [];
    array().push(fresh(spec.item));
    changed();
    draw(array().length - 1);
    entries.lastElementChild?.querySelector('input:not([readonly]),textarea,select')?.focus();
  }));
  draw();
}

function renderHistory() {
  const list = get('history');
  list.replaceChildren();
  if (!model.history.length) list.append(node('li', '尚無發布紀錄'));
  model.history.forEach((entry) => {
    const row = node('li');
    row.append(node('span', 'v' + entry.version + '・' + formatTime(entry.updatedAt) + (entry.summary ? '・' + entry.summary : '')));
    const actions = node('div');
    actions.className = 'row-actions';
    actions.append(button('匯出', () => perform(async () => download(await rpc('export', { version:entry.version })))), button('還原至草稿', async () => {
      if (!await requestConfirmation('將 v' + entry.version + ' 還原到草稿？目前草稿與未儲存修改會被取代，公開版本仍會保留。')) return;
      perform(async () => {
        applyState(await rpc('restore', { revision:model.revision, version:entry.version }));
        message('已還原至草稿。預覽確認後可發布。');
      });
    }));
    row.append(actions);
    list.append(row);
  });
}
function download(value) {
  const blob = new Blob([JSON.stringify(value, null, 2)], { type:'application/json' });
  const link = node('a');
  const url = URL.createObjectURL(blob);
  link.href = url;
  link.download = '婚禮工作資料-' + (value.version || '未儲存') + '.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function reload() {
  if (dirty && !await requestConfirmation('重新讀取會捨棄未儲存的修改。確定繼續？')) return;
  perform(async () => {
    applyState(await rpc('load'));
    message(draft ? '已讀取伺服器草稿。' : '請先建立第一份草稿。');
  });
}
get('reload').onclick = reload;
get('seed').onchange = () => {
  seedReview = null;
  get('seed-info').textContent = '';
  get('initialize').disabled = true;
};
get('review-seed').onclick = () => perform(async () => {
  const file = get('seed').files[0];
  if (!file || file.size > 800000) throw new Error('請選擇有效的初始化 JSON 檔案。');
  const parsed = JSON.parse(await file.text());
  const candidate = parsed.data || parsed;
  const sanitized = await rpc('preview', { data:candidate });
  seedReview = candidate;
  get('seed-info').textContent = '已驗證。含 ' + candidate.people.length + ' 位人員、' + candidate.teams.length + ' 個工作組別。';
  showPreview(sanitized);
});
get('initialize').onclick = () => perform(async () => {
  if (!seedReview) return;
  applyState(await rpc('initialize', { revision:model.revision, data:seedReview }));
  seedReview = null;
  message('已建立草稿，確認預覽後可發布。');
});
get('save').onclick = () => perform(async () => {
  if (!dirty) { message('草稿已是最新儲存版本。'); return; }
  applyState(await rpc('save', { revision:model.revision, data:draft }));
  message('草稿已儲存。');
});
get('publish').onclick = async () => {
  if (dirty) { message('請先儲存修改，再發布草稿。', true); return; }
  if (!await requestConfirmation('確定發布此草稿？所有工作人員將看到此版本。')) return;
  perform(async () => {
    applyState(await rpc('publish', { revision:model.revision }));
    message('已發布 v' + model.published.version + '・' + formatTime(model.published.updatedAt));
  });
};
get('export').onclick = () => perform(async () => download(await rpc('export')));
get('export-local').onclick = () => download({ data:draft });
get('preview').onclick = () => perform(async () => showPreview(await rpc('preview', { data:draft })));
get('close-preview').onclick = closePreview;

function closePreview() {
  clearTimeout(previewSession?.timer);
  previewSession = null;
  get('preview-frame').replaceChildren();
  get('preview-panel').hidden = true;
}
function showPreview(data) {
  closePreview();
  const panel = get('preview-panel');
  const parent = draft ? get('manager') : get('setup');
  parent.append(panel);
  const url = new URL(model.siteUrl);
  const nonce = crypto.randomUUID();
  url.hash = 'staff-preview=' + nonce;
  const frame = node('iframe');
  frame.title = '婚禮工作指南草稿預覽';
  frame.referrerPolicy = 'no-referrer';
  frame.src = url.href;
  previewSession = { frame, nonce, origin:url.origin, data, timer:setTimeout(() => {
    message('預覽頁未回應，請確認工作人員網站已安裝預覽功能且網址正確。', true);
  }, 12000) };
  get('preview-frame').append(frame);
  panel.hidden = false;
  panel.scrollIntoView({ block:'start' });
}
window.addEventListener('message', (event) => {
  const session = previewSession;
  if (!session || event.source !== session.frame.contentWindow || event.origin !== session.origin) return;
  if (event.data?.type !== 'staff-preview-ready' || event.data?.nonce !== session.nonce) return;
  clearTimeout(session.timer);
  session.frame.contentWindow.postMessage({ type:'staff-preview-data', nonce:session.nonce, data:session.data }, session.origin);
  message('正在預覽目前草稿。');
});
reload();
</script>
</body>
</html>
